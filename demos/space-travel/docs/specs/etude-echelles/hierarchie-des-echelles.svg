  <line x1="608.4" y1="301.0" x2="762.7" y2="301.0" stroke="#8ea0c4" stroke-width="2" opacity="0.5"/>
  <circle cx="608.4" cy="301.0" r="6" fill="#8ea0c4"/>
  <circle cx="701.4" cy="301.0" r="6" fill="#5eead4"/>
  <circle cx="762.7" cy="301.0" r="6" fill="#ffb454"/>
  <text x="598.4" y="304.5" fill="#8ea0c4" font-size="10" text-anchor="end">967</text>
