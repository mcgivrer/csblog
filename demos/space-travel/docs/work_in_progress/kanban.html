<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau des agents</title>
<!-- Kanban des lots SPEC-010. Page FIXE : le chef de projet (stt-cp) ne modifie que plan-status.js. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220; --bg-2:#0e1729; --panel:#0f1a30; --line:#25375c;
  --ink:#e8edf5; --muted:#8ea0c4; --muted-2:#5d6f92;
  --amber:#ffb454; --amber-dim:#a97a3d; --cyan:#5eead4; --red:#ff7a7a; --green:#7ee08a;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; --sans:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;border-radius:0}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.6 var(--sans);
  background:linear-gradient(var(--bg-2) 1px,transparent 1px) 0 0/100% 28px,var(--bg)}
.wrap{max-width:1440px;margin:0 auto;padding:28px 20px 56px}
.mono,.eyebrow,h1,h2,.kpi b,.card .id,.badge,.chip,button,select,label{font-family:var(--mono)}
.eyebrow{color:var(--amber);text-transform:uppercase;letter-spacing:.18em;font-size:12px}
h1{font-size:30px;font-weight:800;margin:6px 0 4px}
h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
  margin:0 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;border-top:1px solid var(--line)}
h2 .n{color:var(--amber-dim)}
.site-header{position:relative;border:1px solid var(--line);background:var(--panel);padding:20px 24px;margin-bottom:20px}
.site-header::before,.site-header::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--amber);border-style:solid}
.site-header::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.site-header::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted-2);font:12px var(--mono)}
.meta b{color:var(--cyan);font-weight:400}
section{margin:26px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{border:1px solid var(--line);background:var(--panel);padding:14px 16px}
.kpi span{display:block;color:var(--muted-2);font:11px var(--mono);text-transform:uppercase;letter-spacing:.12em}
.kpi b{display:block;font-size:24px;margin:4px 0 8px}
.bar{height:6px;background:var(--bg-2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.bar.cy i{background:var(--cyan)} .bar.over i{background:var(--red)}
.small{font-size:12px;color:var(--muted)}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.lot{border:1px solid var(--line);background:var(--panel);padding:10px;cursor:pointer;text-align:left;color:var(--ink)}
.lot[aria-pressed=true]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.lot .t{font:700 13px var(--mono)} .lot .s{font:11px var(--mono);color:var(--muted-2);margin:2px 0 6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:6px 10px;font-size:12px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.col{border:1px solid var(--line);background:rgba(15,26,48,.6);min-height:120px}
.col>header{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);
  font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.1em}
.col[data-s=doing]>header{color:var(--amber)} .col[data-s=review]>header{color:var(--cyan)}
.col[data-s=blocked]>header{color:var(--red)} .col[data-s=done]>header{color:var(--green)}
.col .list{padding:10px;display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);background:var(--panel);padding:10px 12px}
.card[data-s=blocked]{border-left:3px solid var(--red)} .card[data-s=doing]{border-left:3px solid var(--amber)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .id{color:var(--amber);font-size:12px}
.card h3{font:600 14px/1.4 var(--sans);margin:6px 0 8px}
.badge{font-size:10px;padding:1px 6px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.08em}
.badge.cp{color:var(--cyan)} .badge.archi{color:var(--amber)} .badge.dev{color:var(--ink)}
.row{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted-2);margin:6px 0 3px}
.note{font-size:12px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.empty{color:var(--muted-2);font:12px var(--mono);padding:6px 2px}
.split{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}
.panel{border:1px solid var(--line);background:var(--panel);padding:16px}
.agent{margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:11px var(--mono);color:var(--muted-2);text-transform:uppercase;letter-spacing:.1em}
.st{font:11px var(--mono)} .st.ok{color:var(--green)} .st.wait{color:var(--amber)}
.journal li{margin:4px 0;color:var(--muted)} .journal time{font:12px var(--mono);color:var(--cyan);margin-right:8px}
.err{border:1px solid var(--red);color:var(--red);padding:14px;font:13px var(--mono)}
footer{color:var(--muted-2);font:11px var(--mono);margin-top:40px}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.wrap{padding:16px}.kpis,.split{grid-template-columns:1fr}.board{grid-template-columns:1fr}
  h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div class="eyebrow" id="eyebrow">SPEC-010 · Chantier Naval STT</div>
    <h1>Tableau des agents</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div id="err"></div>

  <section class="kpis" id="kpis" aria-label="Indicateurs"></section>

  <section aria-labelledby="h-lots">
    <h2 id="h-lots"><span class="n">01</span>Lots</h2>
    <div class="lots" id="lots"></div>
  </section>

  <section aria-labelledby="h-board">
    <h2 id="h-board"><span class="n">02</span>Tâches</h2>
    <div class="filters" id="filters">
      <span class="small mono">Agent :</span>
      <button data-agent="all" aria-pressed="true">Tous</button>
      <button data-agent="cp" aria-pressed="false">CP</button>
      <button data-agent="archi" aria-pressed="false">ARCHI</button>
      <button data-agent="dev" aria-pressed="false">DEV</button>
      <label><input type="checkbox" id="auto" checked> actualiser toutes les 30 s</label>
      <button id="reload">Actualiser</button>
    </div>
    <div class="board" id="board" style="margin-top:14px"></div>
  </section>

  <section class="split">
    <div>
      <h2><span class="n">03</span>Tokens par agent</h2>
      <div class="panel" id="agents"></div>
    </div>
    <div>
      <h2><span class="n">04</span>Décisions</h2>
      <div class="panel"><table id="decisions"></table></div>
    </div>
  </section>

  <section>
    <h2><span class="n">05</span>Journal</h2>
    <ul class="panel journal" id="journal" style="list-style:none;margin:0"></ul>
  </section>

  <footer>Données : <span class="mono">plan-status.js</span>, tenu par l'agent chef de projet (stt-cp). « ≈ » = estimation, non mesurée.</footer>
</div>

<script>
(function(){
  const COLS = [['todo','À faire'],['doing','En cours'],['review','En revue'],['blocked','Bloqué'],['done','Fait']];
  const LOT_ST = { todo:'à faire', doing:'en cours', review:'en revue', blocked:'bloqué', done:'fait' };
  const AG = { cp:'CP', archi:'ARCHI', dev:'DEV' };
  const view = { lot:'all', agent:'all' };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = (n) => (typeof n === 'number' && isFinite(n)) ? n : 0;
  function tok(n){ n = num(n); return n >= 1e6 ? (n/1e6).toFixed(2).replace('.', ',') + ' M' : n >= 1e3 ? Math.round(n/1e3) + ' k' : String(n); }
  function bar(used, budget, cls){
    const r = budget ? used/budget : 0, over = r > 1;
    return '<div class="bar ' + (cls || '') + (over ? ' over' : '') + '" role="img" aria-label="' + Math.round(r*100) + ' %"><i style="width:' + Math.min(100, r*100).toFixed(1) + '%"></i></div>';
  }
  function used(t){ return num(t.used); }
  function render(){
    const P = window.PLAN;
    if(!P){ $('err').innerHTML = '<div class="err">plan-status.js introuvable ou invalide : vérifier sa syntaxe (window.PLAN = {…};).</div>'; return; }
    $('err').innerHTML = '';
    const tasks = P.tasks || [], lots = P.lots || [];
    const lotUsed = {}; tasks.forEach(t => { lotUsed[t.lot] = (lotUsed[t.lot] || 0) + used(t); });
    const totUsed = tasks.reduce((s, t) => s + used(t), 0), totBudget = lots.reduce((s, l) => s + num(l.budget), 0);
    const done = tasks.filter(t => t.status === 'done').length, blocked = tasks.filter(t => t.status === 'blocked').length;
    const cur = lots.find(l => l.id === P.currentLot) || {};
    $('meta').innerHTML = 'Mis à jour <b>' + esc(P.updated) + '</b>' + '<span>Lot en cours <b>' + esc(P.currentLot || '—') + ' ' + esc(cur.title || '') + '</b></span>' +
      '<span>Spec <b>' + esc(P.spec || '') + '</b></span>';
    $('kpis').innerHTML =
      '<div class="kpi"><span>Tokens consommés</span><b>' + tok(totUsed) + '</b>' + bar(totUsed, totBudget) + '<div class="small">budget total ' + tok(totBudget) + '</div></div>' +
      '<div class="kpi"><span>Tâches faites</span><b>' + done + ' / ' + tasks.length + '</b>' + bar(done, tasks.length || 1, 'cy') + '<div class="small">' + (tasks.length - done) + ' restantes</div></div>' +
      '<div class="kpi"><span>Lot en cours</span><b>' + esc(P.currentLot || '—') + '</b>' + bar(lotUsed[cur.id] || 0, num(cur.budget)) + '<div class="small">' + tok(lotUsed[cur.id] || 0) + ' / ' + tok(cur.budget) + '</div></div>' +
      '<div class="kpi"><span>Bloquées</span><b style="color:' + (blocked ? 'var(--red)' : 'var(--green)') + '">' + blocked + '</b><div class="small">' + (blocked ? 'décision ou correction attendue' : 'aucun blocage') + '</div></div>';
    $('lots').innerHTML = '<button class="lot" data-lot="all" aria-pressed="' + (view.lot === 'all') + '"><div class="t">Tous</div><div class="s">' + lots.length + ' lots</div>' + bar(totUsed, totBudget) + '</button>' +
      lots.map(l => { const u = lotUsed[l.id] || 0, pct = l.budget ? Math.round(100*u/l.budget) : 0;
        return '<button class="lot" data-lot="' + esc(l.id) + '" aria-pressed="' + (view.lot === l.id) + '" title="' + esc(l.title) + '"><div class="t">' + esc(l.id) + ' · ' + esc(l.title) + '</div>' +
          '<div class="s">' + esc(LOT_ST[l.status] || l.status) + ' · ' + esc(l.version || '') + '</div>' + bar(u, l.budget) +
          '<div class="s" style="margin:4px 0 0">' + tok(u) + ' / ' + tok(l.budget) + (pct > 100 ? ' · +' + (pct - 100) + ' %' : '') + '</div></button>'; }).slice(0).join('');
    const shown = tasks.filter(t => (view.lot === 'all' || t.lot === view.lot) && (view.agent === 'all' || t.agent === view.agent));
    $('board').innerHTML = COLS.map(([s, label]) => {
      const list = shown.filter(t => t.status === s);
      return '<div class="col" data-s="' + s + '"><header><span>' + label + '</span><span>' + list.length + '</span></header><div class="list">' +
        (list.length ? list.map(card).join('') : '<div class="empty">—</div>') + '</div></div>';
    }).join('');
    const byAgent = { cp:0, archi:0, dev:0 }; tasks.forEach(t => { if(t.agent in byAgent) byAgent[t.agent] += used(t); });
    const maxA = Math.max(1, byAgent.cp, byAgent.archi, byAgent.dev);
    $('agents').innerHTML = Object.keys(byAgent).map(a => '<div class="agent"><div class="row" style="margin:0 0 4px"><span><span class="badge ' + a + '">' + AG[a] + '</span></span><span>' + tok(byAgent[a]) +
      (totUsed ? ' · ' + Math.round(100*byAgent[a]/totUsed) + ' %' : '') + '</span></div>' + bar(byAgent[a], maxA, a === 'cp' ? 'cy' : '') + '</div>').join('') +
      '<div class="small">Modèles : ' + esc((P.models && [P.models.cp, P.models.archi, P.models.dev].join(' · ')) || 'CP Sonnet · ARCHI Opus · DEV Sonnet') + '</div>';
    $('decisions').innerHTML = '<tr><th>#</th><th>Sujet</th><th>Statut</th></tr>' + (P.decisions || []).map(d =>
      '<tr><td class="mono">' + esc(d.n) + '</td><td>' + esc(d.subject) + '</td><td class="st ' + (/valid|retenu|ok/i.test(d.status) && !/à valider/i.test(d.status) ? 'ok' : 'wait') + '">' + esc(d.status) + '</td></tr>').join('');
    $('journal').innerHTML = (P.journal || []).slice().reverse().map(j => '<li><time>' + esc(j.at) + '</time>' + esc(j.text) + '</li>').join('') || '<li class="empty">—</li>';
  }
  function card(t){
    const u = used(t), b = num(t.budget), p = Math.max(0, Math.min(100, num(t.progress)));
    return '<article class="card" data-s="' + esc(t.status) + '"><div class="top"><span class="id">' + esc(t.id) + '</span><span class="badge ' + esc(t.agent) + '">' + esc(AG[t.agent] || t.agent) +
      (t.model ? ' · ' + esc(t.model) : '') + '</span></div><h3>' + esc(t.title) + '</h3>' +
      '<div class="row"><span>Avancement</span><span>' + p + ' %</span></div>' + bar(p, 100, 'cy') +
      '<div class="row"><span>Tokens</span><span>' + (t.est ? '≈ ' : '') + (t.used == null ? 'n/m' : tok(u)) + (b ? ' / ' + tok(b) : '') + '</span></div>' + (b ? bar(u, b) : '') +
      (t.updated ? '<div class="row"><span>Mis à jour</span><span>' + esc(t.updated) + '</span></div>' : '') +
      (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '') + '</article>';
  }
  document.addEventListener('click', function(e){
    const l = e.target.closest('[data-lot]'); if(l){ view.lot = l.dataset.lot; render(); return; }
    const a = e.target.closest('[data-agent]');
    if(a){ view.agent = a.dataset.agent; document.querySelectorAll('[data-agent]').forEach(b => b.setAttribute('aria-pressed', b === a)); render(); }
  });
  function reload(){
    const old = document.getElementById('planData'), s = document.createElement('script');
    s.id = 'planData'; s.src = 'plan-status.js?t=' + Date.now();
    s.onload = render; s.onerror = function(){ window.PLAN = null; render(); };
    if(old) old.remove(); document.body.appendChild(s);
  }
  $('reload').addEventListener('click', reload);
  setInterval(function(){ if($('auto').checked) reload(); }, 30000);
  reload();
})();
</script>
</body>
</html>
