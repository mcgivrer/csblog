<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau des agents</title>
<!-- Kanban des lots SPEC-010. Page FIXE : le chef de projet (stt-cp) ne modifie que plan-status.js. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220; --bg-2:#0e1729; --panel:#0f1a30; --line:#25375c;
  --ink:#e8edf5; --muted:#8ea0c4; --muted-2:#5d6f92;
  --amber:#ffb454; --amber-dim:#a97a3d; --cyan:#5eead4; --red:#ff7a7a; --green:#7ee08a;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; --sans:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;border-radius:0}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.6 var(--sans);
  background:linear-gradient(var(--bg-2) 1px,transparent 1px) 0 0/100% 28px,var(--bg)}
.wrap{max-width:1440px;margin:0 auto;padding:28px 20px 56px}
.mono,.eyebrow,h1,h2,.kpi b,.card .id,.badge,.chip,button,select,label{font-family:var(--mono)}
.eyebrow{color:var(--amber);text-transform:uppercase;letter-spacing:.18em;font-size:12px}
h1{font-size:30px;font-weight:800;margin:6px 0 4px}
h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
  margin:0 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;border-top:1px solid var(--line)}
h2 .n{color:var(--amber-dim)}
.site-header{position:relative;border:1px solid var(--line);background:var(--panel);padding:20px 24px;margin-bottom:20px}
.site-header::before,.site-header::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--amber);border-style:solid}
.site-header::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.site-header::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted-2);font:12px var(--mono)}
.meta b{color:var(--cyan);font-weight:400}
section{margin:26px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{border:1px solid var(--line);background:var(--panel);padding:14px 16px}
.kpi span{display:block;color:var(--muted-2);font:11px var(--mono);text-transform:uppercase;letter-spacing:.12em}
.kpi b{display:block;font-size:24px;margin:4px 0 8px}
.bar{height:6px;background:var(--bg-2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.bar.cy i{background:var(--cyan)} .bar.over i{background:var(--red)}
.small{font-size:12px;color:var(--muted)}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.lot{border:1px solid var(--line);background:var(--panel);padding:10px;cursor:pointer;text-align:left;color:var(--ink)}
.lot[aria-pressed=true]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.lot .t{font:700 13px var(--mono)} .lot .s{font:11px var(--mono);color:var(--muted-2);margin:2px 0 6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:6px 10px;font-size:12px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.col{border:1px solid var(--line);background:rgba(15,26,48,.6);min-height:120px}
.col>header{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);
  font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.1em}
.col[data-s=doing]>header{color:var(--amber)} .col[data-s=review]>header{color:var(--cyan)}
.col[data-s=blocked]>header{color:var(--red)} .col[data-s=done]>header{color:var(--green)}
.col .list{padding:10px;display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);background:var(--panel);padding:10px 12px}
.card[data-s=blocked]{border-left:3px solid var(--red)} .card[data-s=doing]{border-left:3px solid var(--amber)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .id{color:var(--amber);font-size:12px}
.card h3{font:600 14px/1.4 var(--sans);margin:6px 0 8px}
.badge{font-size:10px;padding:1px 6px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.08em}
.badge.cp{color:var(--cyan)} .badge.archi{color:var(--amber)} .badge.dev{color:var(--ink)}
.row{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted-2);margin:6px 0 3px}
.note{font-size:12px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.docs{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.docs>span{display:block;font:10px var(--mono);color:var(--muted-2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.docs ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.docs li{display:flex;gap:6px;align-items:baseline;min-width:0}
.docs a{font:11px var(--mono);color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.docs a:hover{color:var(--amber);border-bottom-color:var(--amber)}
.badge.r-lu{color:var(--muted)} .badge.r-modifié{color:var(--amber)} .badge.r-créé{color:var(--green)}
.docs .badge{font-size:9px;flex:none}
.nodocs .docs{display:none}
.card .lead{display:flex;align-items:center;gap:8px;min-width:0}
.tg{width:24px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--amber);font-size:14px;line-height:1}
.dmod{position:relative;display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;color:var(--green);cursor:help}
.dmod svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.dmod b{position:absolute;top:-5px;right:-7px;min-width:15px;height:15px;padding:0 3px;background:var(--amber);color:var(--bg);font:700 10px/15px var(--mono);text-align:center}
.card.folded .body{display:none}
.card.folded h3{margin-bottom:0}
.tabs{display:flex;gap:6px;margin:0 0 6px}
.tabs button{padding:8px 16px;font-size:13px}
body[data-view=board] .v-ind,body[data-view=ind] .v-board{display:none}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
td.mono{white-space:nowrap}
.panel svg{display:block;width:100%;height:auto}
.panel svg text{font:10px var(--mono);fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:11px var(--mono);color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.lotrow{display:grid;grid-template-columns:150px 1fr 1fr;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--muted)}
.lotrow:last-child{border-bottom:0}
.lotrow b{color:var(--ink);font-weight:700}
@media (max-width:900px){.charts{grid-template-columns:1fr}.lotrow{grid-template-columns:1fr}}
.empty{color:var(--muted-2);font:12px var(--mono);padding:6px 2px}
.split{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}
.panel{border:1px solid var(--line);background:var(--panel);padding:16px}
.agent{margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:11px var(--mono);color:var(--muted-2);text-transform:uppercase;letter-spacing:.1em}
.st{font:11px var(--mono)} .st.ok{color:var(--green)} .st.wait{color:var(--amber)}
.journal li{margin:4px 0;color:var(--muted)} .journal time{font:12px var(--mono);color:var(--cyan);margin-right:8px}
.err{border:1px solid var(--red);color:var(--red);padding:14px;font:13px var(--mono)}
footer{color:var(--muted-2);font:11px var(--mono);margin-top:40px}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.wrap{padding:16px}.kpis,.split{grid-template-columns:1fr}.board{grid-template-columns:1fr}
  h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-view="board">
<div class="wrap">
  <header class="site-header">
    <div class="eyebrow" id="eyebrow">SPEC-010 · Chantier Naval STT</div>
    <h1>Tableau des agents</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div id="err"></div>

  <section class="kpis" id="kpis" aria-label="Indicateurs"></section>

  <nav class="tabs" role="tablist" aria-label="Vues">
    <button role="tab" data-tab="board" aria-pressed="true" aria-selected="true">Tableau</button>
    <button role="tab" data-tab="ind" aria-pressed="false" aria-selected="false">Indicateurs</button>
  </nav>

  <section class="v-ind" aria-labelledby="h-bd">
    <h2 id="h-bd"><span class="n">01</span>Burndown des tâches</h2>
    <div class="charts">
      <div class="panel" id="burn"></div>
      <div class="panel" id="burnBudget"></div>
    </div>
  </section>
  <section class="v-ind" aria-labelledby="h-bl">
    <h2 id="h-bl"><span class="n">02</span>Burndown par lot</h2>
    <div class="panel" id="burnLots"></div>
  </section>
  <section class="v-ind" aria-labelledby="h-ag">
    <h2 id="h-ag"><span class="n">03</span>Tokens par profil d'agent</h2>
    <div class="charts">
      <div class="panel" id="agentShare"></div>
      <div class="panel" id="agentTable"></div>
    </div>
  </section>

  <section class="v-board" aria-labelledby="h-lots">
    <h2 id="h-lots"><span class="n">01</span>Lots</h2>
    <div class="lots" id="lots"></div>
  </section>

  <section class="v-board" aria-labelledby="h-board">
    <h2 id="h-board"><span class="n">02</span>Tâches</h2>
    <div class="filters" id="filters">
      <span class="small mono">Agent :</span>
      <button data-agent="all" aria-pressed="true">Tous</button>
      <button data-agent="cp" aria-pressed="false">CP</button>
      <button data-agent="archi" aria-pressed="false">ARCHI</button>
      <button data-agent="dev" aria-pressed="false">DEV</button>
      <label><input type="checkbox" id="auto" checked> actualiser toutes les 30 s</label>
      <button id="docsToggle" aria-pressed="true">Docs</button>
      <button id="foldAll" title="Tout déplier / tout replier les tâches terminées">Tout déplier</button>
      <button id="reload">Actualiser</button>
    </div>
    <div class="board" id="board" style="margin-top:14px"></div>
  </section>

  <section class="split v-board">
    <div>
      <h2><span class="n">03</span>Tokens par agent</h2>
      <div class="panel" id="agents"></div>
    </div>
    <div>
      <h2><span class="n">04</span>Décisions</h2>
      <div class="panel"><table id="decisions"></table></div>
    </div>
  </section>

  <section class="v-board">
    <h2><span class="n">05</span>Journal</h2>
    <ul class="panel journal" id="journal" style="list-style:none;margin:0"></ul>
  </section>

  <footer>Données : <span class="mono">plan-status.js</span>, tenu par l'agent chef de projet (stt-cp). « ≈ » = estimation, non mesurée.</footer>
</div>

<script>
(function(){
  const COLS = [['todo','À faire'],['doing','En cours'],['review','En revue'],['blocked','Bloqué'],['done','Fait']];
  const LOT_ST = { todo:'à faire', doing:'en cours', review:'en revue', blocked:'bloqué', done:'fait' };
  const AG = { cp:'CP', archi:'ARCHI', dev:'DEV' };
  const view = { lot:'all', agent:'all' };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = (n) => (typeof n === 'number' && isFinite(n)) ? n : 0;
  function tok(n){ n = num(n); return n >= 1e6 ? (n/1e6).toFixed(2).replace('.', ',') + ' M' : n >= 1e3 ? Math.round(n/1e3) + ' k' : String(n); }
  function bar(used, budget, cls){
    const r = budget ? used/budget : 0, over = r > 1;
    return '<div class="bar ' + (cls || '') + (over ? ' over' : '') + '" role="img" aria-label="' + Math.round(r*100) + ' %"><i style="width:' + Math.min(100, r*100).toFixed(1) + '%"></i></div>';
  }
  function used(t){ return num(t.used); }
  function render(){
    const P = window.PLAN;
    if(!P){ $('err').innerHTML = '<div class="err">plan-status.js introuvable ou invalide : vérifier sa syntaxe (window.PLAN = {…};).</div>'; return; }
    $('err').innerHTML = '';
    const tasks = P.tasks || [], lots = P.lots || [];
    const lotUsed = {}; tasks.forEach(t => { lotUsed[t.lot] = (lotUsed[t.lot] || 0) + used(t); });
    const totUsed = tasks.reduce((s, t) => s + used(t), 0), totBudget = lots.reduce((s, l) => s + num(l.budget), 0);
    const done = tasks.filter(t => t.status === 'done').length, blocked = tasks.filter(t => t.status === 'blocked').length;
    const cur = lots.find(l => l.id === P.currentLot) || {};
    $('meta').innerHTML = 'Mis à jour <b>' + esc(P.updated) + '</b>' + '<span>Lot en cours <b>' + esc(P.currentLot || '—') + ' ' + esc(cur.title || '') + '</b></span>' +
      '<span>Spec <b>' + esc(P.spec || '') + '</b></span>';
    $('kpis').innerHTML =
      '<div class="kpi"><span>Tokens consommés</span><b>' + tok(totUsed) + '</b>' + bar(totUsed, totBudget) + '<div class="small">budget total ' + tok(totBudget) + '</div></div>' +
      '<div class="kpi"><span>Tâches faites</span><b>' + done + ' / ' + tasks.length + '</b>' + bar(done, tasks.length || 1, 'cy') + '<div class="small">' + (tasks.length - done) + ' restantes</div></div>' +
      '<div class="kpi"><span>Lot en cours</span><b>' + esc(P.currentLot || '—') + '</b>' + bar(lotUsed[cur.id] || 0, num(cur.budget)) + '<div class="small">' + tok(lotUsed[cur.id] || 0) + ' / ' + tok(cur.budget) + '</div></div>' +
      '<div class="kpi"><span>Bloquées</span><b style="color:' + (blocked ? 'var(--red)' : 'var(--green)') + '">' + blocked + '</b><div class="small">' + (blocked ? 'décision ou correction attendue' : 'aucun blocage') + '</div></div>';
    $('lots').innerHTML = '<button class="lot" data-lot="all" aria-pressed="' + (view.lot === 'all') + '"><div class="t">Tous</div><div class="s">' + lots.length + ' lots</div>' + bar(totUsed, totBudget) + '</button>' +
      lots.map(l => { const u = lotUsed[l.id] || 0, pct = l.budget ? Math.round(100*u/l.budget) : 0;
        return '<button class="lot" data-lot="' + esc(l.id) + '" aria-pressed="' + (view.lot === l.id) + '" title="' + esc(l.title) + '"><div class="t">' + esc(l.id) + ' · ' + esc(l.title) + '</div>' +
          '<div class="s">' + esc(LOT_ST[l.status] || l.status) + ' · ' + esc(l.version || '') + '</div>' + bar(u, l.budget) +
          '<div class="s" style="margin:4px 0 0">' + tok(u) + ' / ' + tok(l.budget) + (pct > 100 ? ' · +' + (pct - 100) + ' %' : '') + '</div></button>'; }).slice(0).join('');
    const shown = tasks.filter(t => (view.lot === 'all' || t.lot === view.lot) && (view.agent === 'all' || t.agent === view.agent));
    $('board').innerHTML = COLS.map(([s, label]) => {
      const list = shown.filter(t => t.status === s);
      return '<div class="col" data-s="' + s + '"><header><span>' + label + '</span><span>' + list.length + '</span></header><div class="list">' +
        (list.length ? list.map(card).join('') : '<div class="empty">—</div>') + '</div></div>';
    }).join('');
    const byAgent = { cp:0, archi:0, dev:0 }; tasks.forEach(t => { if(t.agent in byAgent) byAgent[t.agent] += used(t); });
    const maxA = Math.max(1, byAgent.cp, byAgent.archi, byAgent.dev);
    $('agents').innerHTML = Object.keys(byAgent).map(a => '<div class="agent"><div class="row" style="margin:0 0 4px"><span><span class="badge ' + a + '">' + AG[a] + '</span></span><span>' + tok(byAgent[a]) +
      (totUsed ? ' · ' + Math.round(100*byAgent[a]/totUsed) + ' %' : '') + '</span></div>' + bar(byAgent[a], maxA, a === 'cp' ? 'cy' : '') + '</div>').join('') +
      '<div class="small">Modèles : ' + esc((P.models && [P.models.cp, P.models.archi, P.models.dev].join(' · ')) || 'CP Sonnet · ARCHI Opus · DEV Sonnet') + '</div>';
    $('decisions').innerHTML = '<tr><th>#</th><th>Sujet</th><th>Statut</th></tr>' + (P.decisions || []).map(d =>
      '<tr><td class="mono">' + esc(d.n) + '</td><td>' + esc(d.subject) + '</td><td class="st ' + (/valid|retenu|ok/i.test(d.status) && !/à valider/i.test(d.status) ? 'ok' : 'wait') + '">' + esc(d.status) + '</td></tr>').join('');
    renderInd(tasks, lots, byAgent, totUsed);
    $('journal').innerHTML = (P.journal || []).slice().reverse().map(j => '<li><time>' + esc(j.at) + '</time>' + esc(j.text) + '</li>').join('') || '<li class="empty">—</li>';
  }
  const ROLES = { 'lu':'lu', 'modifié':'modifié', 'créé':'créé' };
  function docs(t){
    if(!Array.isArray(t.docs) || !t.docs.length) return '';
    return '<div class="docs"><span>Docs (' + t.docs.length + ')</span><ul>' + t.docs.filter(d => d && d.f).map(d => {
      const r = ROLES[d.r] || 'lu', name = String(d.f).split('/').pop(), href = '../../' + d.f;
      return '<li><span class="badge r-' + esc(r) + '">' + esc(r) + '</span><a href="' + esc(href) + '" target="_blank" rel="noopener" title="' + esc(d.f + ' (' + r + ')') + '">' + esc(name) + '</a></li>';
    }).join('') + '</ul></div>';
  }
  const AGC = { cp:'var(--cyan)', archi:'var(--amber)', dev:'#c9d4ea' };
  const pct = (a, b) => b ? Math.round(1000 * a / b) / 10 : 0;
  const fr1 = (n) => String(n).replace('.', ',');
  const ts = (s) => { const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? null : d.getTime(); };
  const hhmm = (ms) => { const d = new Date(ms); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + 'h' + String(d.getMinutes()).padStart(2,'0'); };
  // Courbe de burndown : pas descendant (réel) + droite idéale. pts = [[ms, valeur restante]]
  function burnSvg(pts, total, unit, fmt){
    const W = 640, H = 250, L = 48, R = 14, T = 14, B = 34;
    if(pts.length < 2) return '<div class="empty">Pas assez de données datées.</div>';
    const x0 = pts[0][0], x1 = Math.max(pts[pts.length-1][0], x0 + 60000), top = total || 1;
    const X = (v) => L + (W - L - R) * (v - x0) / (x1 - x0), Y = (v) => T + (H - T - B) * (1 - v / top);
    let g = '';
    for(let i = 0; i <= 4; i++){ const v = top * i / 4;
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="' + (L - 6) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end">' + fmt(Math.round(v)) + '</text>'; }
    for(let i = 0; i <= 3; i++){ const v = x0 + (x1 - x0) * i / 3;
      g += '<text x="' + X(v).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="' + (i === 0 ? 'start' : i === 3 ? 'end' : 'middle') + '">' + hhmm(v) + '</text>'; }
    let d = ''; pts.forEach((p, i) => { d += (i ? ' H' + X(p[0]).toFixed(1) + ' V' : 'M') + (i ? '' : X(p[0]).toFixed(1) + ' ') + Y(p[1]).toFixed(1); });
    const ideal = 'M' + X(x0).toFixed(1) + ' ' + Y(total).toFixed(1) + ' L' + X(x1).toFixed(1) + ' ' + Y(0).toFixed(1);
    const last = pts[pts.length - 1];
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Burndown en ' + esc(unit) + '">' + g +
      '<path d="' + ideal + '" fill="none" stroke="var(--cyan)" stroke-width="1.5" stroke-dasharray="5 4"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--amber)" stroke-width="2.2"/>' +
      '<circle cx="' + X(last[0]).toFixed(1) + '" cy="' + Y(last[1]).toFixed(1) + '" r="3.5" fill="var(--amber)"/></svg>' +
      '<div class="legend"><span><i style="background:var(--amber)"></i>Restant (réel)</span><span><i style="background:var(--cyan)"></i>Trajectoire idéale</span><span>Restant : <b style="color:var(--ink)">' + fmt(last[1]) + ' ' + esc(unit) + '</b> / ' + fmt(total) + '</span></div>';
  }
  function renderInd(tasks, lots, byAgent, totUsed){
    const dated = tasks.filter(t => t.status === 'done' && ts(t.updated) != null).sort((a, b) => ts(a.updated) - ts(b.updated));
    const nT = tasks.length, bud = (t) => num(t.budget);
    const totB = tasks.reduce((s, t) => s + bud(t), 0);
    if(dated.length){
      const t0 = ts(dated[0].updated);
      let rem = nT, remB = totB; const p1 = [[t0, rem]], p2 = [[t0, remB]];
      dated.forEach(t => { rem--; remB -= bud(t); p1.push([ts(t.updated), rem]); p2.push([ts(t.updated), Math.max(0, remB)]); });
      $('burn').innerHTML = '<div class="small" style="margin-bottom:8px">Tâches restantes dans le plan (' + nT + ' au total), selon la date de fin de chaque tâche.</div>' + burnSvg(p1, nT, 'tâches', String);
      $('burnBudget').innerHTML = '<div class="small" style="margin-bottom:8px">Budget de tokens restant à consommer (somme des budgets des tâches non terminées).</div>' + burnSvg(p2, totB, 'tokens', tok);
    } else { $('burn').innerHTML = $('burnBudget').innerHTML = '<div class="empty">Aucune tâche terminée datée.</div>'; }
    $('burnLots').innerHTML = lots.map(l => {
      const lt = tasks.filter(t => t.lot === l.id), d = lt.filter(t => t.status === 'done').length, u = lt.reduce((s, t) => s + used(t), 0), b = num(l.budget);
      return '<div class="lotrow"><span><b>' + esc(l.id) + '</b> ' + esc(l.title) + '</span>' +
        '<span>Tâches : ' + d + ' / ' + lt.length + ' · reste ' + (lt.length - d) + (lt.length ? bar(d, lt.length, 'cy') : '<div class="small">aucune tâche détaillée</div>') + '</span>' +
        '<span>Tokens : ' + tok(u) + ' / ' + tok(b) + ' · reste ' + tok(Math.max(0, b - u)) + (u > b ? ' (dépassement +' + tok(u - b) + ')' : '') + bar(u, b) + '</span></div>';
    }).join('');
    const ks = ['cp', 'archi', 'dev'], R = 52, C = 2 * Math.PI * R;
    let off = 0, arcs = '';
    ks.forEach(a => { const f = totUsed ? byAgent[a] / totUsed : 0, len = f * C;
      arcs += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + AGC[a] + '" stroke-width="22" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)"><title>' + AG[a] + ' : ' + tok(byAgent[a]) + '</title></circle>'; off += len; });
    $('agentShare').innerHTML = '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 140 140" style="width:170px;flex:none" role="img" aria-label="Part des tokens par profil">' + arcs +
      '<text x="70" y="68" text-anchor="middle" style="font:700 15px var(--mono);fill:var(--ink)">' + tok(totUsed) + '</text><text x="70" y="82" text-anchor="middle">tokens</text></svg><div style="flex:1;min-width:160px">' +
      ks.map(a => '<div style="margin:0 0 10px"><div class="row" style="margin:0 0 3px"><span><i style="display:inline-block;width:10px;height:10px;background:' + AGC[a] + ';margin-right:6px"></i>' + AG[a] + '</span><span>' + fr1(pct(byAgent[a], totUsed)) + ' %</span></div>' +
        '<div class="bar"><i style="width:' + pct(byAgent[a], totUsed) + '%;background:' + AGC[a] + '"></i></div></div>').join('') + '</div></div>';
    $('agentTable').innerHTML = '<table><tr><th>Profil</th><th>Consommés</th><th>Budget</th><th>Part</th><th>Tâches faites</th></tr>' + ks.map(a => {
      const at = tasks.filter(t => t.agent === a), b = at.reduce((s, t) => s + bud(t), 0), d = at.filter(t => t.status === 'done').length;
      return '<tr><td><span class="badge ' + a + '">' + AG[a] + '</span></td><td class="mono">' + tok(byAgent[a]) + '</td><td class="mono">' + tok(b) + (b && byAgent[a] > b ? ' <span style="color:var(--red)">+' + Math.round(100 * (byAgent[a] / b - 1)) + ' %</span>' : '') +
        '</td><td class="mono">' + fr1(pct(byAgent[a], totUsed)) + ' %</td><td class="mono">' + d + ' / ' + at.length + '</td></tr>'; }).join('') +
      '<tr><td class="mono">Total</td><td class="mono">' + tok(totUsed) + '</td><td class="mono">' + tok(totB) + '</td><td class="mono">100 %</td><td class="mono">' + tasks.filter(t => t.status === 'done').length + ' / ' + nT + '</td></tr></table>' +
      '<div class="small" style="margin-top:8px">Les tokens « ≈ » (estimés) et « n/m » (non mesurés, comptés 0) sont repris tels quels de plan-status.js.</div>';
  }
  const open = {};  // état déplié (mémoire JS, survit au rafraîchissement) ; undefined = défaut (replié si done)
  try { Object.assign(open, JSON.parse(localStorage.getItem('kanbanOpen') || '{}')); } catch(e){}
  function saveOpen(){ try { localStorage.setItem('kanbanOpen', JSON.stringify(open)); } catch(e){} }
  const isOpen = (t) => t.status !== 'done' || open[t.id] === true;
  const DOC_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z M9.5 1.5v3h3 M5.5 8h5 M5.5 11h5"/></svg>';
  function modBadge(t){
    const n = (Array.isArray(t.docs) ? t.docs : []).filter(d => d && (d.r === 'modifié' || d.r === 'créé')).length;
    if(!n) return '';
    const tip = n + (n > 1 ? ' documents modifiés ou créés' : ' document modifié ou créé');
    return '<span class="dmod" role="img" title="' + tip + '" aria-label="' + tip + '">' + DOC_SVG + '<b>' + n + '</b></span>';
  }
  function card(t){
    const u = used(t), b = num(t.budget), p = Math.max(0, Math.min(100, num(t.progress)));
    const o = isOpen(t), fold = t.status === 'done';
    const tg = fold ? '<button class="tg" data-toggle="' + esc(t.id) + '" aria-expanded="' + o + '" aria-label="' + (o ? 'Replier' : 'Déplier') + ' la tâche ' + esc(t.id) + '">' + (o ? '▾' : '▸') + '</button>' : '';
    return '<article class="card' + (o ? '' : ' folded') + '" data-s="' + esc(t.status) + '"><div class="top"><span class="lead">' + tg + modBadge(t) + '<span class="id">' + esc(t.id) + '</span></span><span class="badge ' + esc(t.agent) + '">' + esc(AG[t.agent] || t.agent) +
      (t.model ? ' · ' + esc(t.model) : '') + '</span></div><h3>' + esc(t.title) + '</h3><div class="body">' +
      '<div class="row"><span>Avancement</span><span>' + p + ' %</span></div>' + bar(p, 100, 'cy') +
      '<div class="row"><span>Tokens</span><span>' + (t.est ? '≈ ' : '') + (t.used == null ? 'n/m' : tok(u)) + (b ? ' / ' + tok(b) : '') + '</span></div>' + (b ? bar(u, b) : '') +
      (t.updated ? '<div class="row"><span>Mis à jour</span><span>' + esc(t.updated) + '</span></div>' : '') +
      (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '') + docs(t) + '</div></article>';
  }
  document.addEventListener('click', function(e){
    const tb = e.target.closest('[data-tab]');
    if(tb){ document.body.dataset.view = tb.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach(b => { const on = b === tb; b.setAttribute('aria-pressed', on); b.setAttribute('aria-selected', on); }); return; }
    const g = e.target.closest('[data-toggle]');
    if(g){ const id = g.dataset.toggle, card = g.closest('.card'), o = card.classList.contains('folded');
      open[id] = o; saveOpen(); card.classList.toggle('folded', !o);
      g.setAttribute('aria-expanded', o); g.textContent = o ? '▾' : '▸';
      g.setAttribute('aria-label', (o ? 'Replier' : 'Déplier') + ' la tâche ' + id); return; }
    const l = e.target.closest('[data-lot]'); if(l){ view.lot = l.dataset.lot; render(); return; }
    const a = e.target.closest('[data-agent]');
    if(a){ view.agent = a.dataset.agent; document.querySelectorAll('[data-agent]').forEach(b => b.setAttribute('aria-pressed', b === a)); render(); }
  });
  function reload(){
    const old = document.getElementById('planData'), s = document.createElement('script');
    s.id = 'planData'; s.src = 'plan-status.js?t=' + Date.now();
    s.onload = render; s.onerror = function(){ window.PLAN = null; render(); };
    if(old) old.remove(); document.body.appendChild(s);
  }
  $('docsToggle').addEventListener('click', function(){
    const on = this.getAttribute('aria-pressed') !== 'true'; this.setAttribute('aria-pressed', on);
    $('board').classList.toggle('nodocs', !on);
  });
  $('foldAll').addEventListener('click', function(){
    const expand = this.textContent === 'Tout déplier';
    ((window.PLAN && window.PLAN.tasks) || []).forEach(t => { if(t.status === 'done') open[t.id] = expand; });
    saveOpen(); this.textContent = expand ? 'Tout replier' : 'Tout déplier'; render();
  });
  $('reload').addEventListener('click', reload);
  setInterval(function(){ if($('auto').checked) reload(); }, 30000);
  reload();
})();
</script>
</body>
</html>
