  <circle cx="745.7" cy="339.0" r="6" fill="#5eead4"/>
  <circle cx="806.8" cy="339.0" r="6" fill="#ffb454"/>
  <text x="644.0" y="342.5" fill="#8ea0c4" font-size="10" text-anchor="end">2 584</text>
  <text x="816.8" y="342.5" fill="#ffb454" font-size="10" text-anchor="start">70 000</text>
  <text x="24" y="381.0" fill="#e8edf5" font-size="12">Étoile voisine la plus proche</text>
  <line x1="523.3" y1="377.0" x2="830.6" y2="377.0" stroke="#8ea0c4" stroke-width="2" opacity="0.5"/>
  <circle cx="523.3" cy="377.0" r="6" fill="#8ea0c4"/>
  <circle cx="769.1" cy="377.0" r="6" fill="#5eead4"/>
  <circle cx="830.6" cy="377.0" r="6" fill="#ffb454"/>
  <text x="513.3" y="380.5" fill="#8ea0c4" font-size="10" text-anchor="end">154</text>
  <text x="840.6" y="380.5" fill="#ffb454" font-size="10" text-anchor="start">117 000</text>
  <text x="24" y="419.0" fill="#e8edf5" font-size="12">Saut entre deux étapes</text>
  <line x1="614.6" y1="415.0" x2="873.0" y2="415.0" stroke="#8ea0c4" stroke-width="2" opacity="0.5"/>
  <circle cx="614.6" cy="415.0" r="6" fill="#8ea0c4"/>
  <circle cx="811.8" cy="415.0" r="6" fill="#5eead4"/>
  <circle cx="873.0" cy="415.0" r="6" fill="#ffb454"/>
  <text x="604.6" y="418.5" fill="#8ea0c4" font-size="10" text-anchor="end">1 104</text>
  <text x="883.0" y="418.5" fill="#ffb454" font-size="10" text-anchor="start">292 000</text>
  <text x="24" y="504" fill="#8ea0c4" font-size="11">Aujourd'hui, tout tient sur deux décades ; la cible en occupe cinq.</text>
