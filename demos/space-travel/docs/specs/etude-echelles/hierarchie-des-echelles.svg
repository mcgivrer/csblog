  <line x1="610.0" y1="84" x2="610.0" y2="434" stroke="#25375c" stroke-width="1"/>
  <text x="610.0" y="78" fill="#8ea0c4" font-size="10" text-anchor="middle">1 000</text>
  <line x1="716.7" y1="84" x2="716.7" y2="434" stroke="#25375c" stroke-width="1"/>
  <text x="716.7" y="78" fill="#8ea0c4" font-size="10" text-anchor="middle">10 000</text>
  <line x1="823.3" y1="84" x2="823.3" y2="434" stroke="#25375c" stroke-width="1"/>
  <text x="823.3" y="78" fill="#8ea0c4" font-size="10" text-anchor="middle">100 000</text>
  <line x1="930.0" y1="84" x2="930.0" y2="434" stroke="#25375c" stroke-width="1"/>
