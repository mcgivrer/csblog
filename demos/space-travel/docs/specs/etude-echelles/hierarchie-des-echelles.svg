  <line x1="547.4" y1="225.0" x2="630.3" y2="225.0" stroke="#8ea0c4" stroke-width="2" opacity="0.5"/>
  <circle cx="547.4" cy="225.0" r="6" fill="#8ea0c4"/>
  <circle cx="598.5" cy="225.0" r="6" fill="#5eead4"/>
  <circle cx="630.3" cy="225.0" r="6" fill="#ffb454"/>
  <text x="537.4" y="228.5" fill="#8ea0c4" font-size="10" text-anchor="end">259</text>
  <text x="640.3" y="228.5" fill="#ffb454" font-size="10" text-anchor="start">1 550</text>
  <text x="24" y="267.0" fill="#e8edf5" font-size="12">Étoile de type solaire (rayon)</text>
  <line x1="305.6" y1="263.0" x2="656.0" y2="263.0" stroke="#8ea0c4" stroke-width="2" opacity="0.5"/>
