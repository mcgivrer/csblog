<!DOCTYPE html>

<title>3D CITY — GTA-like in true 3D (Three.js)</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;width:100%;font-family:'Courier New',monospace;}
  #wrap{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;}
  canvas#three-canvas{display:block;width:100vw;height:100vh;}
  #wrap.cyber canvas#three-canvas{filter:contrast(1.25) saturate(1.6) brightness(1.05) hue-rotate(-6deg);}

  #vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 50px rgba(0,0,0,0.55);}
  #wrap.cyber #vignette{box-shadow:inset 0 0 190px 60px rgba(160,0,180,0.35), inset 0 0 60px 10px rgba(0,220,255,0.12);}

  #intro{position:absolute;inset:0;background:rgba(0,10,3,0.92);color:#39ff6a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;z-index:20;font-size:14px;line-height:1.7;letter-spacing:0.5px;}
  #intro h1{font-size:28px;text-shadow:0 0 12px #39ff6a;margin-bottom:6px;letter-spacing:4px;}
  #intro .sub{opacity:0.75;margin-bottom:18px;}
  #intro kbd{background:#0c2b14;border:1px solid #39ff6a;border-radius:3px;padding:1px 7px;margin:0 2px;}
  #intro .blink{margin-top:22px;animation:blk 1s infinite;}
  @keyframes blk{50%{opacity:0.15;}}

  #hud{position:absolute;inset:0;pointer-events:none;z-index:5;}
  #topbar{position:absolute;top:0;left:0;width:100%;height:60px;
    background:linear-gradient(rgba(6,10,8,0.92),rgba(6,10,8,0.55));
    border-bottom:2px solid rgba(57,255,106,0.35);
    display:flex;align-items:center;padding:0 18px;box-sizing:border-box;color:#eafff0;}
  #energyWrap{display:flex;flex-direction:column;margin-right:24px;}
  #energyLabel{font-size:10px;color:#bfe;margin-bottom:2px;}
  #energyBar{width:180px;height:16px;border:1.5px solid #39ff6a;box-sizing:border-box;}
  #energyFill{height:100%;width:100%;background:#39ff6a;}
  #money{font-size:18px;font-weight:bold;color:#ffd23f;margin-right:24px;}
  #wanted{margin-left:auto;font-size:20px;color:#555;letter-spacing:2px;}
  #wanted.active{color:#ffd23f;text-shadow:0 0 8px #ffd23f;}

  #statusLine{position:absolute;bottom:14px;right:16px;background:rgba(0,0,0,0.45);
    color:#eafff0;font-size:13px;padding:5px 10px;border-radius:3px;}
  #statusLine.hint{color:#ffd23f;}

  #minimapBox{position:absolute;left:16px;bottom:16px;width:216px;height:246px;
    background:rgba(248,247,242,0.97);border:2px solid #2a2a2a;box-sizing:border-box;}
  #minimapTitle{position:absolute;top:4px;left:8px;font-size:11px;color:#333;}
  canvas#minimapCanvas{position:absolute;left:8px;top:24px;width:200px;height:200px;}

  #bigmapOverlay{position:absolute;inset:0;background:rgba(0,0,0,0.72);z-index:10;display:none;}
  #bigmapOverlay.show{display:block;}
  #bigmapPanel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(248,247,242,0.98);border:3px solid #2a2a2a;padding:34px 20px 20px;}
  #bigmapTitle{position:absolute;top:8px;left:16px;font-size:16px;color:#222;}
  canvas#bigmapCanvas{display:block;}
  #bigmapLegend{position:absolute;top:50%;left:calc(50% + 260px);transform:translateY(-50%);
    color:#eafff0;font-size:13px;line-height:1.9;}
  #bigmapLegend .lg{display:flex;align-items:center;margin-bottom:2px;}
  #bigmapLegend .sw{width:14px;height:14px;border-radius:50%;margin-right:10px;flex:none;}

  .panelOverlay{position:absolute;inset:0;background:rgba(0,0,0,0.72);z-index:10;display:none;
    align-items:center;justify-content:center;}
  .panelOverlay.show{display:flex;}
  .panelBox{background:rgba(10,16,12,0.97);border:2px solid #39ff6a;border-radius:8px;
    color:#eafff0;padding:20px 26px;width:min(560px,88vw);max-height:80vh;overflow-y:auto;
    box-shadow:0 0 30px rgba(57,255,106,0.25);}
  .panelBox h2{margin:0 0 14px;font-size:18px;letter-spacing:3px;color:#39ff6a;text-shadow:0 0 8px rgba(57,255,106,0.5);}
  .panelBox .section{font-size:12px;letter-spacing:2px;color:#ffd23f;margin:16px 0 8px;}
  .mlTitle{font-size:14px;color:#ffd23f;letter-spacing:1px;margin-bottom:4px;}
  .mlDesc{font-size:13px;line-height:1.5;opacity:0.92;}
  .mlReward{font-size:13px;color:#39ff6a;margin-top:6px;font-weight:bold;}
  .mlItem{font-size:12.5px;line-height:1.6;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.08);}
  .mlRewardSmall{color:#39ff6a;}

  #inventoryPanel{display:flex;gap:18px;}
  #inventoryList{flex:1;min-width:180px;max-height:60vh;overflow-y:auto;}
  .invrow{padding:7px 8px;border-radius:4px;font-size:13px;display:flex;align-items:center;gap:8px;cursor:default;}
  .invrow.sel{background:rgba(57,255,106,0.18);outline:1px solid rgba(57,255,106,0.5);}
  .invrow .ic{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;}
  #inventoryDetail{flex:1;min-width:200px;border-left:1px solid rgba(255,255,255,0.15);padding-left:18px;}
  #inventoryDetail .dname{font-size:15px;color:#ffd23f;margin-bottom:10px;}
  #inventoryDetail .drow{font-size:13px;margin-bottom:6px;opacity:0.92;}
  .empty{opacity:0.6;font-size:13px;font-style:italic;}
  .helpRow{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:13px;}
  .helpRow kbd{flex:none;min-width:70px;text-align:center;background:#0c2b14;border:1px solid #39ff6a;border-radius:3px;padding:1px 7px;}

  #missionDialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-58%);
    min-width:300px;max-width:min(560px,86vw);padding:16px 26px;background:rgba(8,14,10,0.93);
    border:1px solid #39ff6a;border-radius:8px;color:#eafff0;text-align:center;z-index:9;
    opacity:0;pointer-events:none;transition:opacity 0.45s ease, transform 0.45s ease;
    box-shadow:0 0 34px rgba(57,255,106,0.28);}
  #missionDialog.show{opacity:1;transform:translate(-50%,-50%);}
  #missionDialog .mtitle{font-size:14px;letter-spacing:3px;color:#ffd23f;margin-bottom:8px;text-shadow:0 0 8px rgba(255,210,63,0.55);}
  #missionDialog .mdesc{font-size:14px;line-height:1.5;margin-bottom:10px;}
  #missionDialog .mreward{font-size:16px;color:#39ff6a;font-weight:bold;}

  #itemToast{position:fixed;top:64%;left:50%;transform:translate(-50%,0);
    padding:10px 20px;background:rgba(8,14,10,0.93);border:1px solid #ffd23f;border-radius:6px;

<script>
const APP_LANG = (function(){
  const nav = (navigator.language || (navigator.languages && navigator.languages[0]) || 'en').toLowerCase();
  return nav.startsWith('fr') ? 'fr' : 'en';
})();
const LOAD_ERROR_TXT = APP_LANG==='fr'
  ? {title:'Erreur de chargement', sub:'Impossible de charger Three.js depuis internet.', body:"Vérifie ta connexion réseau (ou un bloqueur de script/CDN), puis recharge la page."}
  : {title:'Loading error', sub:'Could not load Three.js from the internet.', body:'Check your network connection (or a script/CDN blocker), then reload the page.'};
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=()=>resolve(true); s.onerror=()=>reject(new Error('failed: '+src));
    document.head.appendChild(s);
  });
}
const THREE_CDN_URLS=[
  'https://unpkg.com/three@0.147.0/build/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r147/three.min.js'
];
async function loadThreeJs(){
  for(const url of THREE_CDN_URLS){
    try{ await loadScriptOnce(url); if(window.THREE) return true; }catch(e){ /* essaie le CDN suivant */ }
  }
  return false;
}
loadThreeJs().then(ok=>{
  if(!ok || !window.THREE){
    const introEl=document.getElementById('intro');
    introEl.innerHTML=`<h1>${LOAD_ERROR_TXT.title}</h1>`
      +`<div class="sub">${LOAD_ERROR_TXT.sub}</div>`
      +`<div>${LOAD_ERROR_TXT.body}</div>`;
    return;
  }
  if(typeof DecompressionStream==='undefined'){
    const introEl=document.getElementById('intro');
    const msg = APP_LANG==='fr'
      ? "Ton navigateur ne supporte pas la décompression native (DecompressionStream) requise par ce jeu. Utilise une version récente de Chrome, Firefox, Edge ou Safari."
      : "Your browser doesn't support the native decompression (DecompressionStream) required by this game. Please use a recent version of Chrome, Firefox, Edge, or Safari.";
    introEl.innerHTML=`<h1>${LOAD_ERROR_TXT.title}</h1><div class="sub">${msg}</div>`;
    return;
  }
  startGame().catch(err=>{
    console.error(err);
    const introEl=document.getElementById('intro');
    introEl.innerHTML=`<h1>${LOAD_ERROR_TXT.title}</h1><div class="sub">${LOAD_ERROR_TXT.body}</div>`;
  });
});
</script>

const CELL = 6;        // taille d'une cellule de grille, en unités three.js ("mètres")
// convertit une vitesse réaliste (km/h) en unités de grille par seconde (dépend de CELL)
// -> garantit que piétons / véhicules / joueur restent sur une échelle de vitesse cohérente
function kmh(v){ return v / 3.6 / CELL; }

const ICELL = 3;        // taille d'une cellule à l'intérieur d'une boutique

const SIDEWALK_H = 0.12; // hauteur du trottoir par rapport à la route (spec trottoirs §2)

function prand(x,y){ const n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function isRoadLine(v){ const m=((v%BLOCK)+BLOCK)%BLOCK; return m<ROADW; }
// hauteur du sol (réelle, pas seulement visuelle) à une position donnée : trottoir surélevé,
// route/parc au niveau 0 -> utilisée par le joueur, les piétons et les véhicules pour rester
// visuellement posés sur la bonne surface (spec trottoirs : "le trottoir doit être surélevé")
function groundHeightAt(gx,gy){
  const ix=Math.floor(gx), iy=Math.floor(gy);
  if(ix<0||iy<0||ix>=MAP||iy>=MAP) return 0;
  return grid[iy][ix]==='B' ? SIDEWALK_H : 0;
}

// =====================================================================================
//  ZONAGE DE LA VILLE : districts (affaires / résidentiel / industriel / nature)
//  Option retenue : grille de districts (macro-cellules), avec un biais centre-ville
//  affaires -> périphérie résidentielle/industrielle -> une zone nature garantie.
// =====================================================================================
const ZONE_MACRO=14; // taille d'une macro-cellule de district, en cases de grille
const ZONE_N=Math.ceil(MAP/ZONE_MACRO);
const zoneGrid=[];
{
  const center=(ZONE_N-1)/2;
  const maxD=Math.hypot(center,center)||1; // distance max réelle au centre (coin de la grille)
  const parkMX=Math.min(ZONE_N-1,Math.floor(prand(11.3,17.9)*ZONE_N));
  const parkMY=Math.min(ZONE_N-1,Math.floor(prand(23.7,5.1)*ZONE_N));
  for(let my=0;my<ZONE_N;my++){
    const row=[];
    for(let mx=0;mx<ZONE_N;mx++){
      const dNorm=Math.hypot(mx-center,my-center)/maxD; // normalisée 0 (centre) -> 1 (coin)
      let z;
      if(mx===parkMX&&my===parkMY) z='nature';
      else if(dNorm<0.35) z='business';
      else if(dNorm<0.75) z = prand(mx*3.1,my*7.7)<0.55 ? 'residential' : 'business';
      else z = prand(mx*5.3,my*2.9)<0.55 ? 'industrial' : 'residential';
      row.push(z);
    }
    zoneGrid.push(row);
  }
}
function zoneAt(x,y){
  const mx=Math.min(ZONE_N-1,Math.max(0,Math.floor(x/ZONE_MACRO)));
  const my=Math.min(ZONE_N-1,Math.max(0,Math.floor(y/ZONE_MACRO)));
  return zoneGrid[my][mx];
}
function blockZone(bx,by){ return zoneAt(bx*BLOCK+BLOCK/2, by*BLOCK+BLOCK/2); }

// deux boulevards diagonaux qui traversent toute la ville en coupant les pâtés de
// maisons -> casse le pur quadrillage sans toucher au réseau routier orthogonal
// (qui reste garanti pour la circulation IA et les itinéraires de mission).
function onBoulevard(x,y){
  const d1=Math.abs((x-y)-8);
  const d2=Math.abs((x+y)-MAP*1.05);
  return d1<1.4 || d2<1.4;
}

// =====================================================================================
//  GENERATION PROCEDURALE DE LA VILLE (grille logique, indépendante du rendu)
// =====================================================================================
const ZONE_PARK_CHANCE={business:0.10, residential:0.22, industrial:0.07, nature:0.85};
const grid=[], heightMap=[];
for(let y=0;y<MAP;y++){
  let row='', hrow=[];
  for(let x=0;x<MAP;x++){
    let ch;
    if(x===0||y===0||x===MAP-1||y===MAP-1) ch='B';
    else if(onBoulevard(x,y)) ch='.';
    else if(isRoadLine(x)||isRoadLine(y)) ch='.';
    else {
      const z=zoneAt(x,y);
      ch = prand(x*1.3,y*1.7) < ZONE_PARK_CHANCE[z] ? 'P' : 'B';
    }
    row+=ch;
    let h=3;
    if(ch==='B'){
      const bx=Math.floor(x/BLOCK), by=Math.floor(y/BLOCK);
      const z=blockZone(bx,by);
      const seed=prand(bx*3.1,by*5.3);
      if(z==='business'){ h=18+seed*37; if(prand(bx*9,by*9)<0.12) h*=1.6; }
      else if(z==='residential'){ h=7+seed*9; }
      else if(z==='industrial'){ h=6+seed*5; }
      else { h=4+seed*3; } // nature : rares petites structures
    }
    hrow.push(h);
  }
  grid.push(row); heightMap.push(hrow);
}
const roadLines=[]; for(let k=1;k*BLOCK<MAP-1;k++) roadLines.push(k*BLOCK);

function isWalkable(gridArr,sizeX,sizeY,x,y){
  if(x<0.15||y<0.15||x>=sizeX-0.15||y>=sizeY-0.15) return false;
  return gridArr[Math.floor(y)][Math.floor(x)]!=='B';
}
function findRoadNear(cx,cy){
  for(let r=0;r<20;r++)
    for(let dy=-r;dy<=r;dy++)
      for(let dx=-r;dx<=r;dx++){
        const x=cx+dx,y=cy+dy;
        if(x>1&&y>1&&x<MAP-2&&y<MAP-2&&grid[y][x]!=='B') return {x:x+0.5,y:y+0.5};
      }
  return {x:cx+0.5,y:cy+0.5};
}

// arbres (parcs)
const trees=[];
for(let y=1;y<MAP-1;y++){
  for(let x=1;x<MAP-1;x++){
    if(grid[y][x]!=='P') continue;
    const n=1+Math.floor(prand(x*4.1,y*6.7)*2);
    for(let i=0;i<n;i++){
      const ox=0.22+prand(x*2+i,y*3+i)*0.56;
      const oy=0.22+prand(x*5+i,y*8+i)*0.56;
      const h=4.2+prand(x*11+i,y*13+i)*2.4;
      trees.push({x:x+ox,y:y+oy,h});
    }
  }
}

const shops=[];
const shopByCell={};
{
  const candidates=[]; const seen=new Set();
  for(let y=1;y<MAP-1;y++) for(let x=1;x<MAP-1;x++){
    if(grid[y][x]!=='B') continue;
    const neigh=[[1,0,'E'],[-1,0,'W'],[0,1,'S'],[0,-1,'N']];
    for(const [ddx,ddy,dir] of neigh){
      const nx=x+ddx, ny=y+ddy;
      if(nx<0||ny<0||nx>=MAP||ny>=MAP) continue;
      if(grid[ny][nx]==='.'){ candidates.push({x,y,dir}); break; }
    }
  }
  const chosen=[];
  for(const c of candidates){
    const key=c.x+','+c.y;
    if(seen.has(key)) continue;
    if(prand(c.x*17.3,c.y*11.7)<0.09){ chosen.push(c); seen.add(key); }
  }
  for(const c of chosen.slice(0,16)){
    const cat=SHOP_CATEGORIES[Math.floor(prand(c.x*3.3,c.y*5.1)*SHOP_CATEGORIES.length)%SHOP_CATEGORIES.length];
    const name=genShopName(cat);
    let doorX=c.x+0.5, doorY=c.y+0.5, faceAngle=0;
    if(c.dir==='E'){ doorX=c.x+1; doorY=c.y+0.5; faceAngle=0; }
    if(c.dir==='W'){ doorX=c.x;   doorY=c.y+0.5; faceAngle=Math.PI; }
    if(c.dir==='S'){ doorX=c.x+0.5; doorY=c.y+1; faceAngle=Math.PI/2; }
    if(c.dir==='N'){ doorX=c.x+0.5; doorY=c.y;   faceAngle=-Math.PI/2; }
    const shop={ x:c.x,y:c.y,dir:c.dir,doorX,doorY,faceAngle,name,cat,color:cat.color,
      items: cat.items.map(nm=>({name:nm, price:15+Math.floor(prand(nm.length*3.1,c.x+c.y*2.7)*45)})) };
    shops.push(shop); shopByCell[c.x+','+c.y]=shop;
  }
}

function buildShopInteriorPlan(shop){
  const rows=[
    'BBBBBBBBBBB',
    'B.........B',
    'B.S.S.S.S.B',
    'B.........B',
    'B.S.S.S.S.B',
    'B.........B',
    'B...CCC...B',
    'B.........B',
    'BBBBB.BBBBB'
  ];
  const W=11,H=9;
  const gridArr=[], itemArr=[], counterArr=[], shelfArr=[];
  let shelfCount=0;
  for(let y=0;y<H;y++){
    let rowChars=''; const itemRow=[],counterRow=[],shelfRow=[];
    for(let x=0;x<W;x++){
      const ch=rows[y][x]; const solid=ch!=='.';
      rowChars+= solid?'B':'.';
      if(ch==='S'){ itemRow.push(shelfCount<shop.items.length?shelfCount:-1); shelfRow.push(true); shelfCount++; }
      else { itemRow.push(-1); shelfRow.push(false); }
      counterRow.push(ch==='C');
    }
    gridArr.push(rowChars); itemArr.push(itemRow); counterArr.push(counterRow); shelfArr.push(shelfRow);
  }
  return {grid:gridArr, itemMap:itemArr, counterMap:counterArr, shelfMap:shelfArr, W, H,
    doorWorld:{x:5.5,y:8.3}, shopkeeper:{x:5.5,y:5.6}};
}

const skyUniforms={

  bottomColor:{value:new THREE.Color(skyColors.day.bottom)},

};
const skyMat=new THREE.ShaderMaterial({
  uniforms:skyUniforms,
  vertexShader:`
    varying vec3 vWorldPosition;
    void main(){
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader:`
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float offset;
    uniform float exponent;
    varying vec3 vWorldPosition;
    void main(){
      float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
      gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
    }
  `,
  side:THREE.BackSide,
  fog:false
});

function makeCloudTexture(){
  const c=document.createElement('canvas'); c.width=128; c.height=128;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(64,64,4,64,64,62);
  g.addColorStop(0,'rgba(255,255,255,0.95)');
  g.addColorStop(0.5,'rgba(255,255,255,0.55)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

const RAIN_COUNT=420, RAIN_HEIGHT=40, RAIN_RADIUS=70;
const rainPositions=new Float32Array(RAIN_COUNT*2*3);
const rainSpeeds=new Float32Array(RAIN_COUNT);
for(let i=0;i<RAIN_COUNT;i++){
  const x=(Math.random()-0.5)*RAIN_RADIUS*2, y=Math.random()*RAIN_HEIGHT, z=(Math.random()-0.5)*RAIN_RADIUS*2;
  rainPositions[i*6+0]=x; rainPositions[i*6+1]=y; rainPositions[i*6+2]=z;
  rainPositions[i*6+3]=x; rainPositions[i*6+4]=y-1.1; rainPositions[i*6+5]=z;
  rainSpeeds[i]=14+Math.random()*10;
}
const rainGeo=new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions,3));
const rainMat=new THREE.LineBasicMaterial({color:0xaad4ff, transparent:true, opacity:0.55, fog:false});
const rainLines=new THREE.LineSegments(rainGeo, rainMat);
rainLines.visible=false;
scene.add(rainLines);
function updateRain(dt){
  if(!rainLines.visible) return;
  const pos=rainGeo.attributes.position.array;
  for(let i=0;i<RAIN_COUNT;i++){
    const dy=rainSpeeds[i]*dt;
    pos[i*6+1]-=dy; pos[i*6+4]-=dy;
    if(pos[i*6+1]<0){
      const x=(Math.random()-0.5)*RAIN_RADIUS*2, z=(Math.random()-0.5)*RAIN_RADIUS*2;
      pos[i*6+0]=x; pos[i*6+1]=RAIN_HEIGHT; pos[i*6+2]=z;
      pos[i*6+3]=x; pos[i*6+4]=RAIN_HEIGHT-1.1; pos[i*6+5]=z;
    }
  }
  gameState.rainAnchor && rainLines.position.copy(gameState.rainAnchor);
  rainGeo.attributes.position.needsUpdate=true;
}

const cityGroup=new THREE.Group(); scene.add(cityGroup);

{
  const tileGeo=new THREE.BoxGeometry(CELL*0.98, 0.2, CELL*0.98);
  const roadMat=new THREE.MeshStandardMaterial({color:0x5a5f63, roughness:1});
  const parkMat=new THREE.MeshStandardMaterial({color:0x2e6b34, roughness:1});
  const sideMat=new THREE.MeshStandardMaterial({color:0xb7b2a6, roughness:0.95}); // trottoir : couleur dédiée (spec §3.1)
  const counts={road:0, park:0, side:0};
  for(let y=0;y<MAP;y++) for(let x=0;x<MAP;x++){
    const c=grid[y][x];
    counts[c==='.'?'road':c==='P'?'park':'side']++;
  }
  const roadTiles=new THREE.InstancedMesh(tileGeo, roadMat, Math.max(1,counts.road));
  const parkTiles=new THREE.InstancedMesh(tileGeo, parkMat, Math.max(1,counts.park));
  const sideTiles=new THREE.InstancedMesh(tileGeo, sideMat, Math.max(1,counts.side));
  const nextIdx={road:0, park:0, side:0};
  const dummy=new THREE.Object3D();
  for(let y=0;y<MAP;y++) for(let x=0;x<MAP;x++){
    const c=grid[y][x];
    const key=c==='.'?'road':c==='P'?'park':'side';
    // trottoir réellement surélevé (pas seulement visuel) : le dessus de la tuile monte de SIDEWALK_H
    const yOffset = key==='side' ? SIDEWALK_H : 0;
    dummy.position.set(x*CELL+CELL/2, 0.1+yOffset, y*CELL+CELL/2);
    dummy.updateMatrix();
    const mesh=key==='road'?roadTiles:key==='park'?parkTiles:sideTiles;
    mesh.setMatrixAt(nextIdx[key], dummy.matrix);
    nextIdx[key]++;
  }
  roadTiles.instanceMatrix.needsUpdate=true;
  parkTiles.instanceMatrix.needsUpdate=true;
  sideTiles.instanceMatrix.needsUpdate=true;
  cityGroup.add(roadTiles, parkTiles, sideTiles);

  // bordures de trottoir : uniquement sur les arêtes trottoir <-> route (spec §3.2)
  const CURB_THICK=0.08;
  const curbMat=new THREE.MeshStandardMaterial({color:0x9a958a, roughness:0.9});
  let curbCount=0;
  for(let y=0;y<MAP;y++) for(let x=0;x<MAP;x++){
    if(grid[y][x]!=='B') continue;
    if(y>0 && grid[y-1][x]==='.') curbCount++;
    if(y<MAP-1 && grid[y+1][x]==='.') curbCount++;
    if(x>0 && grid[y][x-1]==='.') curbCount++;
    if(x<MAP-1 && grid[y][x+1]==='.') curbCount++;
  }
  const curbGeoH=new THREE.BoxGeometry(CELL*0.98, SIDEWALK_H, CURB_THICK); // bordure horizontale (nord/sud)
  const curbGeoV=new THREE.BoxGeometry(CURB_THICK, SIDEWALK_H, CELL*0.98); // bordure verticale (est/ouest)
  const curbH=new THREE.InstancedMesh(curbGeoH, curbMat, Math.max(1,curbCount));
  const curbV=new THREE.InstancedMesh(curbGeoV, curbMat, Math.max(1,curbCount));
  let nH=0, nV=0;
  const curbY=SIDEWALK_H/2; // entre le niveau route (0) et le dessus du trottoir (SIDEWALK_H)
  for(let y=0;y<MAP;y++) for(let x=0;x<MAP;x++){
    if(grid[y][x]!=='B') continue;
    const cx=x*CELL+CELL/2, cz=y*CELL+CELL/2;
    if(y>0 && grid[y-1][x]==='.'){ dummy.position.set(cx,curbY,y*CELL); dummy.updateMatrix(); curbH.setMatrixAt(nH++,dummy.matrix); }
    if(y<MAP-1 && grid[y+1][x]==='.'){ dummy.position.set(cx,curbY,(y+1)*CELL); dummy.updateMatrix(); curbH.setMatrixAt(nH++,dummy.matrix); }
    if(x>0 && grid[y][x-1]==='.'){ dummy.position.set(x*CELL,curbY,cz); dummy.updateMatrix(); curbV.setMatrixAt(nV++,dummy.matrix); }
    if(x<MAP-1 && grid[y][x+1]==='.'){ dummy.position.set((x+1)*CELL,curbY,cz); dummy.updateMatrix(); curbV.setMatrixAt(nV++,dummy.matrix); }
  }
  curbH.instanceMatrix.needsUpdate=true;
  curbV.instanceMatrix.needsUpdate=true;
  cityGroup.add(curbH, curbV);

  // marquage au sol : une ligne centrale par route
  const laneMat=new THREE.MeshBasicMaterial({color:0xe0c840});
  for(const rl of roadLines){
    const c=(rl+ROADW/2)*CELL;
    const lenGeo=new THREE.BoxGeometry(0.25, 0.05, MAP*CELL);
    const lineV=new THREE.Mesh(lenGeo, laneMat);
    lineV.position.set(c, 0.21, MAP*CELL/2);
    cityGroup.add(lineV);
    const lineH=new THREE.Mesh(new THREE.BoxGeometry(MAP*CELL,0.05,0.25), laneMat);
    lineH.position.set(MAP*CELL/2, 0.21, c);
    cityGroup.add(lineH);
  }
}

  industrial:[0x8a8a8a,0x6b6b5f,0x5a5a5a,0x776a5a,0x707070,0x8f8272],
  nature:[0x9a8f7a,0x8a8a8a]
};
function blockShape(bx,by,zone){
  const s=prand(bx*21.3,by*17.9);
  if(zone==='business'){ if(s<0.42) return 'box'; if(s<0.74) return 'cylinder'; return 'stepped'; }
  if(zone==='residential'){ return s<0.88 ? 'box' : 'cylinder'; }
  return 'box'; // industriel et nature : formes simples et utilitaires
}
function blockColor(bx,by,zone){
  const seed=prand(bx*13.7+1,by*29.3+1);
  const palette=BUILD_PALETTES[zone];
  return palette[Math.floor(seed*palette.length)%palette.length];
}

// texture de fenêtres : un canal "couleur" (vitres sombres nettement visibles de jour,
// avec un léger reflet) + un canal "émissif" (fenêtres allumées, visible la nuit)
function buildWindowTextures(){
  const cols=4, rows=6, cw=32, ch=32;
  const W=cols*cw, H=rows*ch;
  const colorCanvas=document.createElement('canvas'); colorCanvas.width=W; colorCanvas.height=H;
  const emCanvas=document.createElement('canvas'); emCanvas.width=W; emCanvas.height=H;
  const cctx=colorCanvas.getContext('2d'), ectx=emCanvas.getContext('2d');
  cctx.fillStyle='#ffffff'; cctx.fillRect(0,0,W,H);
  ectx.fillStyle='#000000'; ectx.fillRect(0,0,W,H);
  const pad=4;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const x=c*cw+pad, y=r*ch+pad, w=cw-2*pad, h=ch-2*pad;
    // vitre bien sombre et contrastée -> nettement visible même en plein jour
    cctx.fillStyle='rgb(25,35,48)';
    cctx.fillRect(x,y,w,h);
    // léger reflet clair en haut de la vitre (effet verre), en plus (pas en remplacement)
    cctx.fillStyle='rgba(255,255,255,0.12)';
    cctx.fillRect(x,y,w,h*0.3);
    if(Math.random()<0.4){ ectx.fillStyle='#ffdca8'; ectx.fillRect(x,y,w,h); }
  }
  const colorTex=new THREE.CanvasTexture(colorCanvas);
  const emTex=new THREE.CanvasTexture(emCanvas);
  [colorTex,emTex].forEach(t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,5); t.needsUpdate=true; });
  return {colorTex,emTex};
}
const windowTex=buildWindowTextures();

// géométries partagées (une seule fois, réutilisées par tous les matériaux/compartiments)
const boxGeo=new THREE.BoxGeometry(1,1,1);
const cylGeo=new THREE.CylinderGeometry(0.5,0.5,1,14);

// un matériau par couleur (pas par bâtiment) -> léger nombre de matériaux, très fiable
const buildingMaterials=[];
const materialByColor={};
function getBuildingMaterial(colorHex){
  if(materialByColor[colorHex]) return materialByColor[colorHex];
  const mat=new THREE.MeshStandardMaterial({color:colorHex, roughness:0.8, metalness:0.08,
    map:windowTex.colorTex, emissive:0xffdca8, emissiveMap:windowTex.emTex, emissiveIntensity:0});
  materialByColor[colorHex]=mat;
  buildingMaterials.push(mat);
  return mat;
}

// PASSE 1 : on détermine forme+couleur de chaque bâtiment et on compte par compartiment
// (un compartiment = une combinaison forme+couleur => un InstancedMesh dédié)
const bucketCounts={};
function bucketKey(shape,color){ return shape+':'+color; }
for(let y=0;y<MAP;y++) for(let x=0;x<MAP;x++){
  if(grid[y][x]!=='B') continue;
  const bx=Math.floor(x/BLOCK), by=Math.floor(y/BLOCK);
  const zone=blockZone(bx,by);
  const key=bucketKey(blockShape(bx,by,zone), blockColor(bx,by,zone));
  bucketCounts[key]=(bucketCounts[key]||0)+1;
}

// création d'un InstancedMesh (ou paire base+sommet pour les tours à retraits) par compartiment
const buckets={};
for(const key in bucketCounts){
  const sep=key.indexOf(':');
  const shape=key.slice(0,sep), color=parseInt(key.slice(sep+1),10);
  const mat=getBuildingMaterial(color);
  const count=bucketCounts[key];
  if(shape==='cylinder'){
    buckets[key]={mesh:new THREE.InstancedMesh(cylGeo, mat, count), next:0};
  } else if(shape==='stepped'){
    buckets[key]={base:new THREE.InstancedMesh(boxGeo, mat, count),
                  top:new THREE.InstancedMesh(boxGeo, mat, count), next:0};
  } else {
    buckets[key]={mesh:new THREE.InstancedMesh(boxGeo, mat, count), next:0};
  }
}

// enseignes lumineuses aléatoires sur certaines façades
const FACE_ROT={E:Math.PI/2, W:-Math.PI/2, S:0, N:Math.PI};
const NEON_COLORS=[0xff2fd0,0x2fe8ff,0xffe72f,0x2fff7a,0xff5a2f];
const buildingSignRefs=[];

// PASSE 2 : remplissage des instances (même logique déterministe que la passe 1)
{
  const dummy=new THREE.Object3D();
  for(let y=0;y<MAP;y++) for(let x=0;x<MAP;x++){
    if(grid[y][x]!=='B') continue;
    const bx=Math.floor(x/BLOCK), by=Math.floor(y/BLOCK);
    const zone=blockZone(bx,by);
    const h=heightMap[y][x];
    const shape=blockShape(bx,by,zone);
    const color=blockColor(bx,by,zone);
    const b=buckets[bucketKey(shape,color)];
    const cx=x*CELL+CELL/2, cz=y*CELL+CELL/2;

    if(shape==='cylinder'){
      dummy.position.set(cx, SIDEWALK_H+h/2, cz);
      dummy.scale.set(CELL*0.66, h, CELL*0.66); // emprise réduite (spec trottoirs §2) : 86% -> 66%
      dummy.updateMatrix();
      b.mesh.setMatrixAt(b.next, dummy.matrix);
      b.next++;
    } else if(shape==='stepped'){
      const baseH=h*0.62, topH=h-baseH;
      dummy.position.set(cx, SIDEWALK_H+baseH/2, cz);
      dummy.scale.set(CELL*0.72, baseH, CELL*0.72); // emprise réduite (spec trottoirs §2) : 94% -> 72%
      dummy.updateMatrix();
      b.base.setMatrixAt(b.next, dummy.matrix);

      dummy.position.set(cx, SIDEWALK_H+baseH+topH/2, cz);
      dummy.scale.set(CELL*0.46, topH, CELL*0.46); // emprise réduite (spec trottoirs §2) : 60% -> 46%
      dummy.updateMatrix();
      b.top.setMatrixAt(b.next, dummy.matrix);
      b.next++;
    } else {
      dummy.position.set(cx, SIDEWALK_H+h/2, cz);
      dummy.scale.set(CELL*0.72, h, CELL*0.72); // emprise réduite (spec trottoirs §2) : 94% -> 72%
      dummy.updateMatrix();
      b.mesh.setMatrixAt(b.next, dummy.matrix);
      b.next++;
    }

    // ~12% des immeubles reçoivent une enseigne lumineuse sur une face
    if(prand(x*5.5+2,y*2.2+2)<0.12){
      const dirs=['E','W','S','N'];
      const dir=dirs[Math.floor(prand(x*9,y*4.3)*4)];
      const ncolor=NEON_COLORS[Math.floor(prand(x*3.3,y*8.1)*NEON_COLORS.length)];
      const half=(shape==='cylinder'?CELL*0.66:CELL*0.72)/2; // demi-largeur réelle de la façade (emprise réduite)
      let sx=cx, sz=cz;
      if(dir==='E') sx=cx+half; else if(dir==='W') sx=cx-half;
      else if(dir==='S') sz=cz+half; else if(dir==='N') sz=cz-half;
      const signMat=new THREE.MeshStandardMaterial({color:0x111111, emissive:ncolor, emissiveIntensity:0.3});
      const signPlane=new THREE.Mesh(new THREE.PlaneGeometry(CELL*0.55, 1.5), signMat);
      signPlane.position.set(sx, SIDEWALK_H+Math.min(h*0.75, h-1), sz);
      signPlane.rotation.y=FACE_ROT[dir];
      cityGroup.add(signPlane);
      buildingSignRefs.push({mesh:signPlane});
    }
  }
  for(const key in buckets){
    const b=buckets[key];
    if(b.mesh) b.mesh.instanceMatrix.needsUpdate=true;
    if(b.base){ b.base.instanceMatrix.needsUpdate=true; b.top.instanceMatrix.needsUpdate=true; }
  }
}
for(const key in buckets){
  const b=buckets[key];
  if(b.mesh) cityGroup.add(b.mesh);
  else cityGroup.add(b.base, b.top);
}

// -------------------------------------------------------------------------------------
// rez-de-chaussée des bâtiments : bibliothèque de 6 styles (spec §4), orientés vers la
// route la plus proche (spec §5). Les bâtiments hébergeant une boutique utilisent le
// style "porte centrée", exactement aligné sur l'entrée fonctionnelle déjà existante,
// remplaçant l'ancienne porte plate (validation : "les nouvelles façades remplacent
// celles des boutiques existantes"). Le trottoir surélevé sert de base (spec §7).
// -------------------------------------------------------------------------------------
const ENTRANCE_H=0.24; // hauteur de l'entrée au-dessus du trottoir, pontée par 3 marches
const STAIR_STEPS=3;
const DIR_NORMAL={E:[1,0],W:[-1,0],S:[0,1],N:[0,-1]};
function nearestRoadDir(x,y){
  const neigh=[[1,0,'E'],[-1,0,'W'],[0,1,'S'],[0,-1,'N']];
  for(const [ddx,ddy,dir] of neigh){
    const nx=x+ddx, ny=y+ddy;
    if(nx<0||ny<0||nx>=MAP||ny>=MAP) continue;
    if(grid[ny][nx]==='.') return dir;
  }
  return null;
}
// tirage pondéré par zone ; sur une façade courbe (cylindre) on exclut les styles à
// étalement latéral (2/3/6), une porte/vitrine centrée reste seule géométriquement correcte
function groundFloorStyleAt(x,y,zone,allowSpread){
  const r=prand(x*13.7+3, y*7.3+5);
  if(!allowSpread){
    if(zone==='industrial') return r<0.5?5:1;
    return r<0.35?1:(r<0.7?4:5);
  }
  if(zone==='business'){
    if(r<0.28) return 2; if(r<0.56) return 3; if(r<0.78) return 4; if(r<0.90) return 1; return 6;
  }
  if(zone==='industrial'){
    if(r<0.55) return 5; if(r<0.80) return 1; return 3;
  }
  if(r<0.42) return 1; if(r<0.62) return 2; if(r<0.80) return 3; if(r<0.93) return 5; return 4;
}

const doorXf=[], stoneXf=[], vitrineXf=[], awningXf=[];
{
  const dm=new THREE.Object3D();
  function pushXf(arr,x,y,z,rotY,sx,sy,sz){
    dm.position.set(x,y,z); dm.rotation.set(0,rotY,0); dm.scale.set(sx,sy,sz);
    dm.updateMatrix();
    arr.push(dm.matrix.clone());
  }
  for(let y=0;y<MAP;y++) for(let x=0;x<MAP;x++){
    if(grid[y][x]!=='B') continue;
    const bx=Math.floor(x/BLOCK), by=Math.floor(y/BLOCK);
    const zone=blockZone(bx,by);
    const shape=blockShape(bx,by,zone);
    const cx=x*CELL+CELL/2, cz=y*CELL+CELL/2;
    const half=(shape==='cylinder'?CELL*0.66:CELL*0.72)/2;

    const shopHere=shopByCell[x+','+y];
    let dir, style;
    if(shopHere){ dir=shopHere.dir; style=1; }
    else {
      dir=nearestRoadDir(x,y);
      style = dir ? groundFloorStyleAt(x,y,zone, shape!=='cylinder') : 5;
    }
    if(!dir || style===5){ if(shopHere){ shopHere._facadeX=cx; shopHere._facadeZ=cz; shopHere._facadeY=SIDEWALK_H; shopHere.doorX=cx/CELL; shopHere.doorY=cz/CELL; } continue; }

    const [nx,nz]=DIR_NORMAL[dir];
    const tx=-nz, tz=nx; // tangente (le long de la façade), pour décaler porte/vitrine sur le côté
    const rotY=FACE_ROT[dir];
    const faceX=cx+nx*half, faceZ=cz+nz*half;
    const hasStairs=(style===1||style===2||style===3||style===6);
    const baseY=SIDEWALK_H+(hasStairs?ENTRANCE_H:0);

    function addStairs(px,pz,widthMul){
      for(let i=0;i<STAIR_STEPS;i++){
        const so=0.3+i*0.32;
        pushXf(stoneXf, px+nx*so, baseY-0.08*(i+0.5), pz+nz*so, rotY, 1.1*widthMul,0.08,0.3);
      }
    }

    if(style===1){
      const px=faceX, pz=faceZ;
      pushXf(doorXf, px,baseY+0.95,pz, rotY, 0.9,1.9,0.08);
      pushXf(stoneXf, px+nx*0.18,baseY,pz+nz*0.18, rotY, 1.1,0.06,0.35);
      addStairs(px,pz,1);
    } else if(style===2 || style===3){
      const doorT=style===2?-0.75:0.75, glassT=-doorT;
      const pdx=faceX+tx*doorT, pdz=faceZ+tz*doorT;
      const pgx=faceX+tx*glassT, pgz=faceZ+tz*glassT;
      pushXf(doorXf, pdx,baseY+0.95,pdz, rotY, 0.9,1.9,0.08);
      pushXf(stoneXf, pdx+nx*0.18,baseY,pdz+nz*0.18, rotY, 1.1,0.06,0.35);
      addStairs(pdx,pdz,1);
      pushXf(vitrineXf, pgx, SIDEWALK_H+0.9, pgz, rotY, 2.0,1.8,0.08);
    } else if(style===4){
      pushXf(vitrineXf, faceX, SIDEWALK_H+0.9, faceZ, rotY, 2.6,1.8,0.08);
    } else if(style===6){
      const p1t=-0.55, p2t=0.55;
      const p1x=faceX+tx*p1t, p1z=faceZ+tz*p1t;
      const p2x=faceX+tx*p2t, p2z=faceZ+tz*p2t;
      pushXf(doorXf, p1x,baseY+0.95,p1z, rotY, 0.8,1.9,0.08);
      pushXf(doorXf, p2x,baseY+0.95,p2z, rotY, 0.8,1.9,0.08);
      pushXf(stoneXf, faceX+nx*0.18,baseY,faceZ+nz*0.18, rotY, 2.0,0.06,0.35);
      addStairs(faceX,faceZ,1.9);
      pushXf(awningXf, faceX,baseY+2.15,faceZ, rotY, 2.1,0.06,0.5);
    }

    if(shopHere){ shopHere._facadeX=faceX; shopHere._facadeZ=faceZ; shopHere._facadeY=baseY; shopHere.doorX=faceX/CELL; shopHere.doorY=faceZ/CELL; }
  }
}
function buildGroundFloorBatch(xforms, mat){
  if(!xforms.length) return null;
  const mesh=new THREE.InstancedMesh(boxGeo, mat, xforms.length);
  xforms.forEach((m,i)=>mesh.setMatrixAt(i,m));
  mesh.instanceMatrix.needsUpdate=true;
  cityGroup.add(mesh);
  return mesh;
}
buildGroundFloorBatch(doorXf, new THREE.MeshStandardMaterial({color:0x3a2414, roughness:0.75}));
buildGroundFloorBatch(stoneXf, new THREE.MeshStandardMaterial({color:0xcac2b0, roughness:0.9}));
buildGroundFloorBatch(vitrineXf, new THREE.MeshStandardMaterial({color:0x1c2733, roughness:0.15, metalness:0.3, transparent:true, opacity:0.55}));
buildGroundFloorBatch(awningXf, new THREE.MeshStandardMaterial({color:0x7a1f2b, roughness:0.85}));

{
  const trunkGeo=new THREE.CylinderGeometry(0.16,0.2,1,6);

  const foliageCounts=FOLIAGE_PALETTE.map(()=>0);

  ));
  const foliageNext=FOLIAGE_PALETTE.map(()=>0);

    trunkMesh.setMatrixAt(i, dummy.matrix);

    const folH=t.h*0.75;
    dummy.position.set(t.x*CELL, trunkH+folH/2, t.y*CELL);
    dummy.scale.set(t.h*0.42, folH, t.h*0.42);
    dummy.updateMatrix();
    const paletteIdx=FOLIAGE_PALETTE.indexOf(foliageColorOf(t));
    foliageMeshes[paletteIdx].setMatrixAt(foliageNext[paletteIdx], dummy.matrix);
    foliageNext[paletteIdx]++;
  });
  trunkMesh.instanceMatrix.needsUpdate=true;
  foliageMeshes.forEach(m=>m.instanceMatrix.needsUpdate=true);
  cityGroup.add(trunkMesh, ...foliageMeshes);
}

// texture utilitaire : dessine icône pixel-art + texte sur un canvas -> CanvasTexture
// -------------------------------------------------------------------------------------
function makeSignTexture(icon, iconColorCss, lines, opts){
  opts=opts||{};
  const W=512, H=256;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  ctx.fillStyle=opts.bg||'#111820'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=opts.border||'#333'; ctx.lineWidth=6; ctx.strokeRect(3,3,W-6,H-6);
  if(icon){
    const px=18;
    const ox=30, oy=(H-7*px)/2;
    ctx.fillStyle=iconColorCss;
    for(let r=0;r<7;r++) for(let cIdx=0;cIdx<7;cIdx++)
      if(icon[r][cIdx]==='X') ctx.fillRect(ox+cIdx*px, oy+r*px, px-1, px-1);
  }
  ctx.fillStyle=opts.textColor||'#fff6d8';
  ctx.font=(opts.big?'bold 40px':'bold 30px')+' "Courier New", monospace';
  ctx.textBaseline='middle';
  const tx=icon?200:24;
  lines.forEach((line,i)=>{
    ctx.fillText(line, tx, H/2 + (i-(lines.length-1)/2)*40);
  });
  const tex=new THREE.CanvasTexture(c);
  tex.needsUpdate=true;
  return tex;
}
function colorToCss(hex){ return '#'+hex.toString(16).padStart(6,'0'); }

const TL_PERIOD=6.4;
function trafficStateAt(ix,iy,t){
  const seed=prand(ix*3,iy*7);
  const phase=(t+seed*TL_PERIOD)%TL_PERIOD;
  if(phase<3.0) return 'g';
  if(phase<3.6) return 'y';
  return 'r';
}
const trafficLights=[];
const poleMat=new THREE.MeshStandardMaterial({color:0x2b2b2b, roughness:0.5, metalness:0.6});
const housingMat=new THREE.MeshStandardMaterial({color:0x161616, roughness:0.4, metalness:0.5});
const LAMP_COLORS=[0xff2222,0xffcc22,0x33ff55]; // rouge, orange, vert (haut vers bas)

function buildTrafficLightGroup(){
  const group=new THREE.Group();

  // poteau vertical
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,3.4,8), poleMat);
  pole.position.y=1.7;
  group.add(pole);

  // petite potence horizontale portant le boîtier (façon feu de carrefour)
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.55,6), poleMat);
  arm.rotation.z=Math.PI/2;
  arm.position.set(0.3,3.35,0);
  group.add(arm);

  // boîtier rectangulaire noir contenant les 3 feux empilés
  const boxDepth=0.22;
  const housing=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.05,boxDepth), housingMat);
  housing.position.set(0.62,3.35,0);
  group.add(housing);

  // 3 disques de couleur (rouge/orange/vert), plaqués sur les deux faces du boîtier
  // (visibles depuis les deux sens de circulation de la rue)
  const lampGeo=new THREE.CircleGeometry(0.135,16);
  const lampYs=[3.7,3.35,3.0];
  const halfDepth=boxDepth/2+0.005;
  const lamps=[];
  for(let i=0;i<3;i++){
    const mat=new THREE.MeshStandardMaterial({color:0x1a1a1a, emissive:LAMP_COLORS[i], emissiveIntensity:0.08, roughness:0.3});
    const front=new THREE.Mesh(lampGeo, mat);
    front.position.set(0.62, lampYs[i], halfDepth);
    group.add(front);

    const back=new THREE.Mesh(lampGeo, mat.clone());
    back.position.set(0.62, lampYs[i], -halfDepth);
    back.rotation.y=Math.PI;
    group.add(back);

    lamps.push({front, back});
  }
  return {group, lamps};
}

// un feu par branche du carrefour (4 coins), chacun orienté vers le centre de l'intersection
const TL_CORNERS=[
  {dx:-0.35,        dy:-0.35,        rot:-Math.PI/4},   // nord-ouest
  {dx:ROADW+0.35,   dy:-0.35,        rot:-3*Math.PI/4}, // nord-est
  {dx:ROADW+0.35,   dy:ROADW+0.35,   rot:3*Math.PI/4},  // sud-est
  {dx:-0.35,        dy:ROADW+0.35,   rot:Math.PI/4}     // sud-ouest
];
for(const ix of roadLines) for(const iy of roadLines){
  for(const c of TL_CORNERS){
    const {group, lamps}=buildTrafficLightGroup();
    group.position.set((ix+c.dx)*CELL, 0, (iy+c.dy)*CELL);
    group.rotation.y=c.rot;
    cityGroup.add(group);
    trafficLights.push({ix,iy, lamps});
  }
}

// -------------------------------------------------------------------------------------
// passages piétons : bandes blanches sur les 4 branches de chaque carrefour
// -------------------------------------------------------------------------------------
const crosswalkStripeMat=new THREE.MeshBasicMaterial({color:0xdddddd});
function addCrosswalk(cx,cz,elongateZ){
  const stripeCount=5, stripeThick=0.55, gap=0.55, stripeLen=ROADW*CELL*0.72;
  const totalSpan=stripeCount*stripeThick+(stripeCount-1)*gap;
  for(let i=0;i<stripeCount;i++){
    const off=-totalSpan/2+i*(stripeThick+gap)+stripeThick/2;
    let geo, px, pz;
    if(elongateZ){ geo=new THREE.BoxGeometry(stripeThick,0.03,stripeLen); px=cx+off; pz=cz; }
    else { geo=new THREE.BoxGeometry(stripeLen,0.03,stripeThick); px=cx; pz=cz+off; }
    const mesh=new THREE.Mesh(geo, crosswalkStripeMat);
    mesh.position.set(px,0.22,pz);
    cityGroup.add(mesh);
  }
}
// coordonnées (en cases de grille) des 4 traversées d'un carrefour
function crosswalkEndpoints(ix,iy,side){
  if(side==='N') return {x1:ix,        y1:iy,        x2:ix+ROADW, y2:iy};
  if(side==='S') return {x1:ix,        y1:iy+ROADW,  x2:ix+ROADW, y2:iy+ROADW};
  if(side==='W') return {x1:ix,        y1:iy,        x2:ix,       y2:iy+ROADW};
  return                {x1:ix+ROADW,  y1:iy,        x2:ix+ROADW, y2:iy+ROADW}; // E
}
for(const ix of roadLines) for(const iy of roadLines){
  addCrosswalk((ix+ROADW/2)*CELL, iy*CELL, true);          // nord (traverse la route verticale)
  addCrosswalk((ix+ROADW/2)*CELL, (iy+ROADW)*CELL, true);  // sud
  addCrosswalk(ix*CELL, (iy+ROADW/2)*CELL, false);         // ouest (traverse la route horizontale)
  addCrosswalk((ix+ROADW)*CELL, (iy+ROADW/2)*CELL, false); // est
}

const signMatsCache={};
const SIGN_TYPES=[{glyph:'STOP', color:0xff3b3b},{glyph:'50', color:0xf2f2f2},{glyph:'→', color:0x3fa7ff}];
for(const ix of roadLines) for(const iy of roadLines){
  if(prand(ix*5+1,iy*5+1)>=0.5) continue;
  const st=SIGN_TYPES[Math.floor(prand(ix*2,iy*9)*SIGN_TYPES.length)%SIGN_TYPES.length];
  const group=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,2.2,6), poleMat);
  pole.position.y=1.1; group.add(pole);
  const tex=makeSignTexture(null, colorToCss(st.color), [st.glyph], {bg:'#f2f2f2', textColor:colorToCss(st.color), border:'#111'});
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.5), new THREE.MeshBasicMaterial({map:tex}));
  panel.position.y=2.1; group.add(panel);
  group.position.set((ix+ROADW+0.35)*CELL, 0, (iy-0.35)*CELL);
  cityGroup.add(group);
}

const streetLights=[];
for(const ly of roadLines){
  for(let x=2;x<MAP-2;x+=4){
    if(!isRoadLine(x)) streetLights.push({x:x+0.5, y:ly-0.4});
  }
}
for(const lx of roadLines){
  for(let y=2;y<MAP-2;y+=4){
    if(!isRoadLine(y)) streetLights.push({x:lx+ROADW+0.4, y:y+0.5});
  }
}
const streetLightRefs=[];
for(const sl of streetLights){
  const group=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,4,6), poleMat);
  pole.position.y=2; group.add(pole);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.18,8,8),
    new THREE.MeshStandardMaterial({color:0xffe9a8, emissive:0xffcc66, emissiveIntensity:0.2}));
  bulb.position.y=4.1; group.add(bulb);
  group.position.set(sl.x*CELL, 0, sl.y*CELL);
  cityGroup.add(group);
  streetLightRefs.push({bulb});
}

// analyseur OBJ minimal et dédié (pas de dépendance externe) : gère v / vn / o / usemtl / f (triangles,
// éventails pour polygones >3 sommets), regroupe les faces par matériau nommé plutôt que par objet,
// ce qui permet de recolorer "peinture" / "neon" / etc. indépendamment sur chaque instance.
// Les modèles ont l'avant vers -X (voir LISEZ-MOI du pack) : on retourne X et Z de 180° à l'import
// pour aligner l'avant sur +X, convention déjà utilisée par le reste du moteur.
function parseVehicleOBJ(text){
  const verts=[];
  const groups={};
  let currentMat='defaut';
  const lines=text.split('\n');
  for(let li=0; li<lines.length; li++){
    const line=lines[li];
    if(line.charCodeAt(0)===35) continue; // '#'
    if(line.startsWith('v ')){
      const p=line.split(/\s+/);
      verts.push([-parseFloat(p[1]), parseFloat(p[2]), -parseFloat(p[3])]); // rotation 180° (avant -X -> +X)
    } else if(line.startsWith('usemtl ')){
      currentMat=line.slice(7).trim();
      if(!groups[currentMat]) groups[currentMat]={positions:[]};
    } else if(line.startsWith('f ')){
      const g=groups[currentMat] || (groups[currentMat]={positions:[]});
      const toks=line.slice(2).trim().split(/\s+/);
      for(let i=1;i<toks.length-1;i++){
        for(const tok of [toks[0], toks[i], toks[i+1]]){
          const v=verts[parseInt(tok,10)-1];
          g.positions.push(v[0],v[1],v[2]);
        }
      }
    }
  }
  return groups;
}

// gabarit géométrique (une fois par modèle) : liste de {matName, geometry}
// les normales ne sont pas transmises (fichiers optimisés) : computeVertexNormals() sur cette
// géométrie non indexée (sommets dupliqués par face) donne exactement le même rendu à facettes
// plates que les normales d'origine, puisque chaque sommet n'appartient qu'à une seule face
const vehicleTemplateCache={};
function getVehicleTemplate(key){
  if(vehicleTemplateCache[key]) return vehicleTemplateCache[key];
  const groups=parseVehicleOBJ(VEHICLE_OBJ_SOURCES[key]);
  const parts=[];
  for(const matName in groups){
    const grp=groups[matName];
    if(!grp.positions.length) continue;
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(grp.positions),3));
    geo.computeVertexNormals();
    parts.push({matName, geo});
  }
  vehicleTemplateCache[key]=parts;
  return parts;
}

// matériaux par défaut selon le rôle nommé dans les modèles (voir LISEZ-MOI du pack)
function defaultVehiclePartColor(matName){
  switch(matName){
    case 'vitrage': return 0x0a1018;
    case 'pneu': return 0x0d0d0d;
    case 'chassis': return 0x2a2e33;
    case 'combinaison': return 0x1c2430;
    case 'casque': return 0xcfd6dc;
    default: return 0x888888;
  }
}

// instancie un véhicule (géométrie partagée, matériaux propres à l'instance -> recolorable)
function instantiateVehicle(modelKey, paintColor, neonColor){
  const parts=getVehicleTemplate(modelKey);
  const group=new THREE.Group();
  const matRefs={};
  for(const part of parts){
    const isNeon = part.matName==='neon';
    const isGlass = part.matName==='vitrage';
    const isTire = part.matName==='pneu';
    const isChassis = part.matName==='chassis';
    const color = part.matName==='peinture' ? paintColor
      : isNeon ? neonColor
      : defaultVehiclePartColor(part.matName);
    const mat=new THREE.MeshStandardMaterial({
      color, roughness:isGlass?0.15:isTire?0.9:0.5, metalness:isChassis?0.5:0.12,
      transparent:isGlass, opacity:isGlass?0.75:1,
      emissive:isNeon?color:0x000000, emissiveIntensity:isNeon?1.6:0
    });
    const mesh=new THREE.Mesh(part.geo, mat);
    group.add(mesh);
    matRefs[part.matName]=mat;
  }
  group.userData.matRefs=matRefs;
  return group;
}

// clignotants : petits feux orange sur l'avant gauche/droite, allumés en clignotant avant un virage
const VEH_DIMS={ car:{frontX:2.4,halfW:1.15}, truck:{frontX:3.8,halfW:1.45}, moto:{frontX:2.0,halfW:0.35} };
function addBlinkers(vehicleGroup, type){
  const d=VEH_DIMS[type]||VEH_DIMS.car;
  const mkMat=()=>new THREE.MeshStandardMaterial({color:0xffa020, emissive:0xffa020, emissiveIntensity:0});
  const bl=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.16), mkMat());
  bl.position.set(d.frontX-0.15, 0.55, d.halfW-0.12);
  vehicleGroup.add(bl);
  const br=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.16), mkMat());
  br.position.set(d.frontX-0.15, 0.55, -(d.halfW-0.12));
  vehicleGroup.add(br);
  return {left:bl, right:br};
}

// décompresse un modèle encodé en base64+gzip via l'API native du navigateur (aucune dépendance externe)
async function inflateBase64Gzip(b64){
  const binStr=atob(b64);
  const bytes=new Uint8Array(binStr.length);
  for(let i=0;i<binStr.length;i++) bytes[i]=binStr.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf=await new Response(stream).arrayBuffer();
  return new TextDecoder('utf-8').decode(buf);
}
const VEHICLE_OBJ_SOURCES={};
for(const key in VEHICLE_OBJ_SOURCES_GZ){
  VEHICLE_OBJ_SOURCES[key]=await inflateBase64Gzip(VEHICLE_OBJ_SOURCES_GZ[key]);
}

    axis, dir:Math.random()<0.5?1:-1, speed:kmh(4+Math.random()*1.5), type:'ped', mesh
  });
}

// piétons "traversants" : attendent au coin puis traversent au passage piéton
// quand la circulation est à l'arrêt (feu rouge côté véhicules) -> signalisation coordonnée
const CROSSER_COUNT=24;
const CROSSER_SIDES=['N','S','W','E'];
for(let i=0;i<CROSSER_COUNT;i++){
  const ix=roadLines[Math.floor(Math.random()*roadLines.length)];
  const iy=roadLines[Math.floor(Math.random()*roadLines.length)];
  const side=CROSSER_SIDES[Math.floor(Math.random()*4)];
  const ends=crosswalkEndpoints(ix,iy,side);
  const startAt0=Math.random()<0.5;
  const mat=new THREE.MeshStandardMaterial({color:PED_COLORS[i%PED_COLORS.length]});
  const mesh=new THREE.Mesh(pedGeo, mat);
  mesh.position.y=0.9;
  cityGroup.add(mesh);
  entities.push({
    type:'crosser', ix, iy, side, ends,
    progress: startAt0?0:1, dir: startAt0?1:-1, waiting:true,
    speed: kmh(4+Math.random()*1.2), mesh
  });
}

function nextIntersectionAhead(pos,dir){
  let best=null;
  for(const rl of roadLines){
    if(dir>0 && rl>pos+0.05){ if(best===null||rl<best) best=rl; }
    if(dir<0 && rl<pos-0.05){ if(best===null||rl>best) best=rl; }
  }
  return best;
}

// géométrie des virages : direction (axe/sens) résultant d'un virage à droite/à gauche
// depuis une direction de déplacement donnée (conduite à droite)
function turnRight(axis,dir){
  const fx=axis==='h'?dir:0, fz=axis==='v'?dir:0;
  const rx=fz, rz=-fx;
  return rx!==0 ? {axis:'h',dir:rx>0?1:-1} : {axis:'v',dir:rz>0?1:-1};
}
function turnLeft(axis,dir){
  const fx=axis==='h'?dir:0, fz=axis==='v'?dir:0;
  const lx=-fz, lz=fx;
  return lx!==0 ? {axis:'h',dir:lx>0?1:-1} : {axis:'v',dir:lz>0?1:-1};
}
// conduite à droite : la voie occupée dépend à la fois du sens ET de l'orientation de la route
// (est -> voie sud/y grand ; ouest -> voie nord/y petit ; sud -> voie ouest/x petit ; nord -> voie est/x grand)
function laneOffset(axis,dir){
  if(axis==='h') return dir>0 ? ROADW*0.75 : ROADW*0.25;
  return dir>0 ? ROADW*0.25 : ROADW*0.75;
}
const ROADTURN_R=ROADW/2; // rayon du virage en arc de cercle

// planifie le prochain carrefour et l'action qui y sera prise (tout droit / gauche / droite) ;
// trajet "aléatoire mais programmé" : la décision est prise à l'avance, loin en amont du carrefour,
// ce qui permet de signaler (clignotant) avant d'y arriver plutôt que de tourner au dernier moment
function ensureVehiclePlan(e){
  if(e.plan) return;
  const pos=e.axis==='h'?e.x:e.y;
  const nl=nextIntersectionAhead(pos,e.dir);
  if(nl===null) return; // pas de carrefour trouvé pour l'instant (proche du bord) -> retente au prochain appel
  const r=Math.random();
  const action = r<0.55?'straight' : r<0.775?'right':'left';
  const plan={line:nl, action, signaled:false};
  if(action!=='straight'){
    const res=(action==='left'?turnLeft:turnRight)(e.axis,e.dir);
    const newLane=nl+laneOffset(res.axis,res.dir);
    const R=ROADTURN_R;
    const sign=action==='right'?1:-1;
    const fx=e.axis==='h'?e.dir:0, fz=e.axis==='v'?e.dir:0;     // cap actuel
    const nfx=res.axis==='h'?res.dir:0, nfz=res.axis==='v'?res.dir:0; // cap après le virage
    // vecteur perpendiculaire "à droite" du cap : right(f)=(fz,-fx)
    const rfx=fz, rfz=-fx, rnfx=nfz, rnfz=-nfx;
    // décalage entre le point de départ de l'arc et son point d'arrivée (tangence garantie aux 2 bouts)
    const deltaX=sign*R*(rfx-rnfx), deltaY=sign*R*(rfz-rnfz);
    // position (sur l'axe actuellement mobile) à laquelle démarrer l'arc pour que la sortie
    // tombe exactement sur la nouvelle voie (newLane)
    const trigger = newLane - (e.axis==='h'?deltaX:deltaY);
    Object.assign(plan,{res,newLane,sign,deltaX,deltaY,trigger});
  }
  e.plan=plan;
}

// distance libre devant le véhicule, sur la même voie (même route, même sens) -> file d'attente réaliste
const VEHICLE_TYPES=new Set(['car','truck','moto']);
function freeGapAhead(e){
  let minGap=Infinity;
  const posE=e.axis==='h'?e.x:e.y;
  const laneE=e.axis==='h'?e.y:e.x;
  for(const o of entities){
    if(o===e || !VEHICLE_TYPES.has(o.type)) continue;
    if(o.axis!==e.axis || o.dir!==e.dir) continue;
    const laneO=o.axis==='h'?o.y:o.x;
    if(Math.abs(laneO-laneE)>0.3) continue; // pas la même voie
    const posO=o.axis==='h'?o.x:o.y;
    const gap=(posO-posE)*e.dir;
    if(gap>0 && gap<minGap) minGap=gap;
  }
  return minGap;
}

function updateTrafficLights(t){
  for(const tl of trafficLights){
    const st=trafficStateAt(tl.ix,tl.iy,t);
    const activeIdx = st==='r'?0 : st==='y'?1 : 2; // 0=rouge,1=orange,2=vert
    tl.lamps.forEach((pair,i)=>{
      const val = i===activeIdx ? 2.4 : 0.08;
      pair.front.material.emissiveIntensity = val;
      pair.back.material.emissiveIntensity = val;
    });
  }
}

function updateEntities(dt,t){
  for(const e of entities){
    if(e.type==='crosser'){
      const canGo=trafficStateAt(e.ix,e.iy,t)==='r'; // véhicules à l'arrêt -> passage autorisé
      if(e.waiting){
        if(canGo) e.waiting=false;
      } else {
        e.progress += e.dir*(e.speed/(ROADW*CELL))*dt;
        if(e.progress>=1){ e.progress=1; e.dir=-1; e.waiting=true; }
        else if(e.progress<=0){ e.progress=0; e.dir=1; e.waiting=true; }
      }
      const gx=e.ends.x1+(e.ends.x2-e.ends.x1)*e.progress;
      const gy=e.ends.y1+(e.ends.y2-e.ends.y1)*e.progress;
      e.x=gx; e.y=gy;
      e.mesh.position.set(gx*CELL, 0.9+groundHeightAt(gx,gy), gy*CELL);
      const dx=(e.ends.x2-e.ends.x1)*e.dir, dz=(e.ends.y2-e.ends.y1)*e.dir;
      if(dx||dz) e.mesh.rotation.y=Math.atan2(-dz,dx);
      continue;
    }
    let speedFactor=1;
    let customRotY=null;
    if(VEHICLE_TYPES.has(e.type)){
      if(e.turning){
        // progression continue le long de l'arc de virage (pas de changement de cap brutal)
        const T=e.turning;
        T.t += dt/T.duration;
        if(T.t>=1){
          e.x=T.exitX; e.y=T.exitY;
          e.axis=T.toAxis; e.dir=T.toDir; e.roadLine=T.roadLine;
          e.turning=null;
        } else {
          const ang=T.angleStart+T.diff*T.t;
          e.x=T.cx+T.r*Math.cos(ang);
          e.y=T.cy+T.r*Math.sin(ang);
          const s=Math.sign(T.diff);
          const tdx=-Math.sin(ang)*s, tdz=Math.cos(ang)*s; // tangente à la trajectoire (cap réel)
          customRotY=Math.atan2(-tdz,tdx);
        }
      } else {
        ensureVehiclePlan(e);
        if(e.plan){
          const pos=e.axis==='h'?e.x:e.y;
          const dLine=(e.plan.line-pos)*e.dir; // distance devant la ligne du carrefour

          // feu de circulation : identité exacte du carrefour (cohérente avec les feux visuels)
          if(dLine<1.3 && dLine>0.12){
            const ix = e.axis==='h' ? e.plan.line : e.roadLine;
            const iy = e.axis==='h' ? e.roadLine : e.plan.line;
            const st=trafficStateAt(ix,iy,t);
            if(st==='r') speedFactor=0; else if(st==='y') speedFactor=0.35;
          }

          if(e.plan.action==='straight'){
            e.blinker=null;
            if(dLine < -(ROADW+0.2)) e.plan=null; // ligne droite terminée -> nouveau plan au prochain appel
          } else {
            // clignotant : allumé bien avant le carrefour
            if(!e.plan.signaled && dLine<4.5 && dLine>0){ e.blinker=e.plan.action; e.plan.signaled=true; }

            // déclenche le virage dès que la position de tangence exacte est atteinte
            // (précalculée dans ensureVehiclePlan pour garantir un raccord tangent, sans saut de cap)
            const dTrigger=(e.plan.trigger-pos)*e.dir;
            if(dTrigger<=0){
              if(dTrigger>-0.5){
                const R=ROADTURN_R;
                const P0x=e.x, P0y=e.y;
                const fx=e.axis==='h'?e.dir:0, fz=e.axis==='v'?e.dir:0;
                const cx=P0x+e.plan.sign*R*fz, cy=P0y+e.plan.sign*R*(-fx); // centre = P0 + rayon x vecteur "à droite" du cap
                const exitX=P0x+e.plan.deltaX, exitY=P0y+e.plan.deltaY;
                const angleStart=Math.atan2(P0y-cy, P0x-cx);
                const angleEnd=Math.atan2(exitY-cy, exitX-cx);
                let diff=angleEnd-angleStart;
                while(diff>Math.PI) diff-=2*Math.PI;
                while(diff<-Math.PI) diff+=2*Math.PI;
                const arcLen=R*Math.abs(diff);
                e.turning={cx,cy,r:R,angleStart,diff,t:0,duration:Math.max(0.05,arcLen/e.speed),
                  exitX,exitY,toAxis:e.plan.res.axis,toDir:e.plan.res.dir,roadLine:e.plan.line};
              } else {
                // point de déclenchement déjà largement dépassé (ex : véhicule qui vient d'apparaître
                // tout près d'un carrefour) -> la géométrie de l'arc serait fausse : on renonce à ce
                // virage pour cette fois et on continue tout droit, un nouveau plan sera fait ensuite
                e.blinker=null;
              }
              e.plan=null;
            }
          }
        }
      }

      // distance de sécurité avec le véhicule qui précède -> ralentit / s'arrête en file
      // (désactivée pendant un virage déjà engagé : on va au bout de la manœuvre)
      if(!e.turning){
        const gap=freeGapAhead(e);
        const SAFE_GAP=1.1, SLOW_GAP=2.4;
        if(gap<SAFE_GAP) speedFactor=0;
        else if(gap<SLOW_GAP) speedFactor=Math.min(speedFactor, (gap-SAFE_GAP)/(SLOW_GAP-SAFE_GAP));
      }
    }
    if(!e.turning){
      if(e.axis==='h') e.x+=e.dir*e.speed*speedFactor*dt; else e.y+=e.dir*e.speed*speedFactor*dt;
      if(e.x<0)e.x+=MAP; if(e.x>=MAP)e.x-=MAP;
      if(e.y<0)e.y+=MAP; if(e.y>=MAP)e.y-=MAP;
    }

    const pedY = e.type==='ped' ? 0.9+groundHeightAt(e.x,e.y) : 0;
    e.mesh.position.set(e.x*CELL, pedY, e.y*CELL);
    if(customRotY!==null){
      e.mesh.rotation.y = customRotY;
    } else {
      // direction de déplacement en repère monde (X,Z) : axe 'h' -> X, axe 'v' -> Z
      const dirX = e.axis==='h' ? e.dir : 0;
      const dirZ = e.axis==='v' ? e.dir : 0;
      // la carrosserie est modélisée avec sa longueur le long de l'axe local X :
      // on aligne cet axe sur la direction réelle de déplacement (dirX, dirZ)
      e.mesh.rotation.y = Math.atan2(-dirZ, dirX);
    }
    const neonMat = e.mesh.userData.matRefs && e.mesh.userData.matRefs.neon;
    if(neonMat) neonMat.emissiveIntensity = night ? 2.4 : 1.4;

    // clignotant : allumé/éteint en alternance quand un virage est prévu
    if(e.blinkers){
      const on = e.blinker && (Math.floor(t*2.5)%2===0);
      e.blinkers.left.material.emissiveIntensity = (on && e.blinker==='left') ? 2.6 : 0;
      e.blinkers.right.material.emissiveIntensity = (on && e.blinker==='right') ? 2.6 : 0;
    }
  }
}

//  INTERIEURS DE BOUTIQUE (construits à la volée en entrant)

let insideShop=null, activeInterior=null;
let activeGrid=grid, activeSizeX=MAP, activeSizeY=MAP, activeCell=CELL, activeOffset=new THREE.Vector3(0,0,0);

function clearGroup(g){ while(g.children.length) g.remove(g.children[0]); }

function buildShopInteriorMeshes(shop, plan){
  clearGroup(interiorGroup);
  const wallMat=new THREE.MeshStandardMaterial({color:0xe6ddc4, roughness:0.95});
  const counterMat=new THREE.MeshStandardMaterial({color:0x7a5028, roughness:0.7});
  const floorMat=new THREE.MeshStandardMaterial({color:0xa9825a, roughness:0.9});
  const ceilMat=new THREE.MeshStandardMaterial({color:0xd6d0be, roughness:1, side:THREE.DoubleSide});
  const shelfMat=new THREE.MeshStandardMaterial({color:0x969688, roughness:0.8});

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(plan.W*ICELL, plan.H*ICELL), floorMat);
  floor.rotation.x=-Math.PI/2;
  floor.position.set(plan.W*ICELL/2, 0, plan.H*ICELL/2);
  interiorGroup.add(floor);
  const ceil=floor.clone(); ceil.material=ceilMat; ceil.position.y=2.6; ceil.rotation.x=Math.PI/2;
  interiorGroup.add(ceil);

  const light=new THREE.PointLight(0xfff2d8, 1.1, plan.W*ICELL*1.4);
  light.position.set(plan.W*ICELL/2, 2.3, plan.H*ICELL/2);
  interiorGroup.add(light);
  interiorGroup.add(new THREE.AmbientLight(0xffffff,0.35));

  for(let y=0;y<plan.H;y++) for(let x=0;x<plan.W;x++){
    if(plan.grid[y][x]!=='B') continue;
    const isCounter=plan.counterMap[y][x];
    const isShelf=plan.shelfMap[y][x];
    const mat = isCounter?counterMat : isShelf?shelfMat : wallMat;
    const h = isCounter?1.1 : isShelf?1.5 : 2.6;
    const box=new THREE.Mesh(new THREE.BoxGeometry(ICELL*0.98,h,ICELL*0.98), mat);
    box.position.set(x*ICELL+ICELL/2, h/2, y*ICELL+ICELL/2);
    interiorGroup.add(box);

    if(isShelf){
      const idx=plan.itemMap[y][x];
      if(idx>=0 && shop.items[idx]){
        const item=shop.items[idx];
        const tex=makeSignTexture(shop.cat.icon, colorToCss(shop.color), [item.name, '$'+item.price], {bg:'#20242a', border:'#000'});
        const label=new THREE.Mesh(new THREE.PlaneGeometry(ICELL*0.9, ICELL*0.9*0.5), new THREE.MeshBasicMaterial({map:tex}));
        label.position.set(x*ICELL+ICELL/2, h+0.05, y*ICELL+ICELL/2);
        label.rotation.x=-Math.PI/2;
        interiorGroup.add(label);
        // petites étiquettes verticales sur chaque face pour rester lisibles en approche
        for(const rot of [0,Math.PI/2,Math.PI,-Math.PI/2]){
          const vLabel=new THREE.Mesh(new THREE.PlaneGeometry(ICELL*0.8, 0.6), new THREE.MeshBasicMaterial({map:tex, transparent:true}));
          vLabel.position.set(x*ICELL+ICELL/2 + Math.sin(rot)*ICELL*0.5, h*0.62, y*ICELL+ICELL/2 + Math.cos(rot)*ICELL*0.5);
          vLabel.rotation.y=rot;
          interiorGroup.add(vLabel);
        }
      }
    }
  }

  // vendeur (simple silhouette) derrière le comptoir
  const shopkeeper=new THREE.Mesh(pedGeo, new THREE.MeshStandardMaterial({color:shop.color}));
  shopkeeper.position.set(plan.shopkeeper.x*ICELL, 0.9, plan.shopkeeper.y*ICELL);
  interiorGroup.add(shopkeeper);

  // porte (repère visuel)
  const doorMark=new THREE.Mesh(new THREE.PlaneGeometry(ICELL*0.6,0.05), new THREE.MeshBasicMaterial({color:0x39ff6a}));
  doorMark.rotation.x=-Math.PI/2;
  doorMark.position.set(plan.doorWorld.x*ICELL, 0.11, (plan.H-0.15)*ICELL);
  interiorGroup.add(doorMark);
}

function enterShop(shop){
  insideShop=shop;
  activeInterior=buildShopInteriorPlan(shop);
  buildShopInteriorMeshes(shop, activeInterior);
  activeGrid=activeInterior.grid; activeSizeX=activeInterior.W; activeSizeY=activeInterior.H;
  activeCell=ICELL; activeOffset=IOFFSET;
  cityGroup.visible=false; interiorGroup.visible=true;
  player.x=activeInterior.doorWorld.x; player.y=activeInterior.doorWorld.y;
  player.yaw=Math.PI; player.vel=0; carMode=false;
  doorFadeFlash();
  beep(480,0.1,'sine',0.05); beep(680,0.12,'sine',0.05);
}
function exitShop(){
  const s=insideShop;
  activeGrid=grid; activeSizeX=MAP; activeSizeY=MAP; activeCell=CELL; activeOffset=new THREE.Vector3(0,0,0);
  cityGroup.visible=true; interiorGroup.visible=false;
  player.x=s.doorX+Math.cos(s.faceAngle)*0.9;
  player.y=s.doorY+Math.sin(s.faceAngle)*0.9;
  player.yaw = Math.PI/2 - s.faceAngle;
  player.vel=0;
  insideShop=null; activeInterior=null;
  doorFadeFlash();
  beep(680,0.1,'sine',0.05); beep(480,0.12,'sine',0.05);
}

const inventory={};
const inventoryMeta={}; // nom -> {price, catName, catColor, catIcon} (dernier achat connu)
function addToInventory(name,n,meta){
  inventory[name]=(inventory[name]||0)+n;
  if(meta) inventoryMeta[name]=meta;
}

function tryInteract(){
  if(!insideShop){
    for(const s of shops){
      if(Math.hypot(player.x-s.doorX,player.y-s.doorY)<1.0){ enterShop(s); return; }
    }
    return;
  }
  const d=activeInterior.doorWorld;
  if(Math.hypot(player.x-d.x,player.y-d.y)<1.1){ exitShop(); return; }
  let best=null,bestDist=1.0;
  for(let y=0;y<activeInterior.H;y++) for(let x=0;x<activeInterior.W;x++){
    const idx=activeInterior.itemMap[y][x];
    if(idx<0) continue;
    const dd=Math.hypot(player.x-(x+0.5), player.y-(y+0.5));
    if(dd<bestDist){ bestDist=dd; best=idx; }
  }
  if(best!==null){
    const item=insideShop.items[best];
    if(!item) return;
    if(money>=item.price){
      money-=item.price;
      addToInventory(item.name,1,{price:item.price, catName:insideShop.cat.name,
        catColor:insideShop.color, catIcon:insideShop.cat.icon});
      beep(1000,0.1,'square',0.06);
      showItemToast(fmt(L.boughtMsg,{item:item.name, price:item.price}));
      if(inventoryOpen) renderInventory();
    } else {
      beep(150,0.2,'sawtooth',0.08);
      showItemToast(fmt(L.notEnoughMoneyMsg,{item:item.name, price:item.price}));
    }
  }
}

// ---------- inventaire (liste + détails, navigation clavier [ ]) ----------
let inventoryOpen=false, inventorySelection=0;
function renderInventory(){
  const names=Object.keys(inventory).filter(n=>inventory[n]>0);
  if(inventorySelection>=names.length) inventorySelection=Math.max(0,names.length-1);
  const listEl=document.getElementById('inventoryList');
  const detailEl=document.getElementById('inventoryDetail');
  if(!names.length){
    listEl.innerHTML=`<div class="empty">${L.emptyInventory}</div>`;
    detailEl.innerHTML='';
    return;
  }
  listEl.innerHTML=names.map((n,i)=>{
    const meta=inventoryMeta[n]||{};
    return `<div class="invrow ${i===inventorySelection?'sel':''}">`
      +`<span class="ic" style="background:${meta.catColor!==undefined?colorToCss(meta.catColor):'#666'}"></span>`
      +`${n} <b style="margin-left:auto">x${inventory[n]}</b></div>`;
  }).join('');
  const cur=names[inventorySelection];
  const meta=inventoryMeta[cur]||{};
  const unitPrice = meta.price!==undefined ? meta.price : null;
  detailEl.innerHTML=`
    <div class="dname">${cur}</div>
    <div class="drow">${L.quantity} : <b>${inventory[cur]}</b></div>
    <div class="drow">${L.unitPrice} : <b>${unitPrice!==null?'$'+unitPrice:'—'}</b></div>
    <div class="drow">${L.category} : <b>${meta.catName||'—'}</b></div>
    <div class="drow">${L.totalValue} : <b>${unitPrice!==null?'$'+(unitPrice*inventory[cur]):'—'}</b></div>
  `;
}
function moveInventorySelection(delta){
  const names=Object.keys(inventory).filter(n=>inventory[n]>0);
  if(!names.length) return;
  inventorySelection=Math.max(0,Math.min(names.length-1,inventorySelection+delta));
  renderInventory();
}

function randomWaypoint(){
  for(let i=0;i<300;i++){
    const x=2+Math.floor(Math.random()*(MAP-4));
    const y=2+Math.floor(Math.random()*(MAP-4));
    if(grid[y][x]!=='B' && Math.hypot(x-player.x,y-player.y)>6) return {x:x+0.5,y:y+0.5};
  }
  return {x:MAP/2,y:MAP/2};
}
function computeRoute(sx,sy,tx,ty){
  function nearestLine(v){ let best=roadLines[0],bd=Infinity; for(const rl of roadLines){ const c=rl+ROADW/2; const d=Math.abs(c-v); if(d<bd){bd=d;best=c;} } return best; }
  const sxr=nearestLine(sx), syr=nearestLine(sy), txr=nearestLine(tx), tyr=nearestLine(ty);
  return [{x:sx,y:sy},{x:sxr,y:syr},{x:sxr,y:tyr},{x:txr,y:tyr},{x:tx,y:ty}];
}
function genMission(){
  const target=randomWaypoint();
  const roll=Math.random(); const street=randStreet();
  let title,desc,requireItem=null;
  let reward=60+Math.floor(Math.random()*220);
  if(roll<0.25 && shops.length){
    const shop=shops[Math.floor(Math.random()*shops.length)];
    const item=shop.items[Math.floor(Math.random()*shop.items.length)];
    const qty=1+Math.floor(Math.random()*3);
    const fn=FIRST_NAMES[Math.floor(Math.random()*FIRST_NAMES.length)];
    const ln=LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)];
    title=L.missionTitleSupply;
    desc=fmt(L.missionDescSupply,{qty,item:item.name,fn,ln,street,shop:shop.name,cat:shop.cat.name});
    reward=qty*Math.round(item.price*1.4)+20;
    requireItem={name:item.name, qty};
  } else if(roll<0.5){
    title=L.missionTitleRetrieval;
    desc=fmt(L.missionDescRetrieval,{obj:OBJECT_NAMES[Math.floor(Math.random()*OBJECT_NAMES.length)], street});
  } else if(roll<0.75){
    const fn=FIRST_NAMES[Math.floor(Math.random()*FIRST_NAMES.length)];
    const ln=LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)];
    title=L.missionTitlePerson;
    desc=fmt(L.missionDescPerson,{fn,ln,street});
  } else {
    title=L.missionTitleDelivery;
    desc=fmt(L.missionDescDelivery,{street});
  }
  return {title,desc,reward,target,requireItem};
}

let audioCtx=null;
function beep(freq,dur,type,vol){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'square'; o.frequency.value=freq||440; g.gain.value=vol||0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+(dur||0.1));
    o.stop(audioCtx.currentTime+(dur||0.1));
  }catch(e){}
}

function shopHint(){
  if(insideShop){
    const d=activeInterior.doorWorld;
    if(Math.hypot(player.x-d.x,player.y-d.y)<1.1) return L.hintExit;
    for(let y=0;y<activeInterior.H;y++) for(let x=0;x<activeInterior.W;x++){
      if(activeInterior.itemMap[y][x]>=0 && Math.hypot(player.x-(x+0.5),player.y-(y+0.5))<1.0) return L.hintBuy;
    }
    return '';
  }
  for(const s of shops){
    if(Math.hypot(player.x-s.doorX,player.y-s.doorY)<1.0) return `${L.hintEnter} — ${s.name}`;
  }
  return '';
}

function update(dt){
  const turnSpeed=2.2;
  if(keys['a']) player.yaw+=turnSpeed*dt;
  if(keys['d']) player.yaw-=turnSpeed*dt;

  let target=0;
  if(keys['w']||keys['z']||keys['arrowup']) target = carMode?kmh(65):kmh(5.5);
  if(keys['s']||keys['arrowdown']) target = carMode?-kmh(20):-kmh(3.2);
  const accel=carMode?1.8:6;
  player.vel += (target-player.vel)*Math.min(1,accel*dt);

  // saut (gravité simple)
  if(player.jumping||player.z>0){
    player.vz-=9.2*dt; player.z+=player.vz*dt;
    if(player.z<=0){ player.z=0; player.vz=0; player.jumping=false; beep(220,0.06,'sine',0.03); }
  }

  const fx=-Math.sin(player.yaw), fy=-Math.cos(player.yaw);
  const mvx=fx*player.vel*dt, mvy=fy*player.vel*dt;
  if(isWalkable(activeGrid,activeSizeX,activeSizeY, player.x+mvx, player.y)) player.x+=mvx;
  if(isWalkable(activeGrid,activeSizeX,activeSizeY, player.x, player.y+mvy)) player.y+=mvy;

  if(!carMode && !insideShop || (!carMode && insideShop)){
    const strafe=(keys['q']?-1:0)+(keys['e']?1:0);
    if(strafe && !carMode){
      const rx=-Math.sin(player.yaw+Math.PI/2), ry=-Math.cos(player.yaw+Math.PI/2);
      const sx=rx*strafe*kmh(4)*dt, sy=ry*strafe*kmh(4)*dt;
      if(isWalkable(activeGrid,activeSizeX,activeSizeY, player.x+sx, player.y)) player.x+=sx;
      if(isWalkable(activeGrid,activeSizeX,activeSizeY, player.x, player.y+sy)) player.y+=sy;
    }
  }

  if(!insideShop){
    const wd=Math.hypot(waypoint.x-player.x, waypoint.y-player.y);
    if(wd<0.8){
      const need=currentMission&&currentMission.requireItem;
      if(need){
        if((inventory[need.name]||0)>=need.qty){
          inventory[need.name]-=need.qty;
          money+=currentMission.reward; beep(1200,0.15,'sine',0.07);
          completeCurrentMission();
        } else if(frameTime-lastShortfallToast>3){
          showItemToast(fmt(L.missingItemMsg,{qty:need.qty, item:need.name}));
          lastShortfallToast=frameTime;
        }
      } else {
        money+=currentMission?currentMission.reward:100; beep(1200,0.15,'sine',0.07);
        completeCurrentMission();
      }
    }

    if(frameTime-lastHitTime>1.2){
      for(const e of entities){
        if(e.type==='ped'||e.type==='crosser') continue;
        if(Math.hypot(e.x-player.x,e.y-player.y)<0.55){
          const relSpeed=Math.abs(player.vel)+e.speed;
          energy=Math.max(0,energy-Math.min(35,8+relSpeed*1.8));
          lastHitTime=frameTime; wanted=Math.min(5,wanted+1); lastInfractionTime=frameTime;
          const pushAng=Math.atan2(player.y-e.y,player.x-e.x);
          player.x+=Math.cos(pushAng)*0.4; player.y+=Math.sin(pushAng)*0.4; player.vel*=0.3;
          beep(140,0.25,'sawtooth',0.09);
          break;
        }
      }
    }
    if(carMode && Math.abs(player.vel)>3 && frameTime-lastInfractionTime>2.5){
      for(const tl of trafficLights){
        const cx=tl.ix+ROADW/2, cy=tl.iy+ROADW/2;
        if(Math.hypot(player.x-cx,player.y-cy)<0.7){
          if(trafficStateAt(tl.ix,tl.iy,frameTime)==='r'){
            wanted=Math.min(5,wanted+1); lastInfractionTime=frameTime; beep(900,0.15,'square',0.06);
          }
          break;
        }
      }
    }
  }
  if(frameTime-lastHitTime>2) energy=Math.min(100,energy+8*dt);
  if(wanted>0 && frameTime-lastInfractionTime>7){
    wantedDecayTimer+=dt;
    if(wantedDecayTimer>5){ wanted=Math.max(0,wanted-1); wantedDecayTimer=0; }
  } else if(wanted===0){ wantedDecayTimer=0; }

  // caméra
  const eyeBase = insideShop ? 1.5 : (carMode?1.05:1.68);
  const bobAmp = carMode?0.02:0.05;
  const moving=Math.abs(player.vel);
  if(moving>0.15) player.walkPhase=(player.walkPhase||0)+moving*dt*(carMode?1.6:3.2);
  const bob = moving>0.15 ? Math.sin(player.walkPhase||0)*bobAmp : 0;
  const groundH = insideShop ? 0 : groundHeightAt(player.x, player.y); // trottoir surélevé réel
  const eyeHeight = eyeBase+bob+player.z+groundH;

  camera.position.set(activeOffset.x+player.x*activeCell, eyeHeight, activeOffset.z+player.y*activeCell);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
}

function bearingArrow(){
  const dx=waypoint.x-player.x, dy=waypoint.y-player.y;
  let ang=Math.atan2(-dy,dx) - (-player.yaw+Math.PI/2); // approx, juste pour l'indicateur HUD

  const dirs=['↑','↗','→','↘','↓','↙','←','↖'];
  const idx=Math.round(((ang+Math.PI)/(2*Math.PI))*8)%8;
  return dirs[(idx+6)%8];
}

function drawPixelIconCtx(ctx,icon,cx,cy,size,color){
  const cell=size/7; const sx=cx-size/2, sy=cy-size/2;
  ctx.fillStyle=color;
  for(let r=0;r<7;r++) for(let c=0;c<7;c++) if(icon[r][c]==='X') ctx.fillRect(sx+c*cell, sy+r*cell, cell+0.4, cell+0.4);
}

function drawMapCore(ctx,mx,my,mapSize,radius,iconScale){
  const cell=mapSize/(radius*2);
  const cosA=Math.cos(player.yaw), sinA=Math.sin(player.yaw);
  const cx0=mx+radius*cell, cy0=my+radius*cell;
  // conversion monde->carte : "avant" = -yaw en repère jeu (x,y logiques)
  function toMap(wdx,wdy){
    const rf = -wdx*Math.sin(player.yaw) - wdy*Math.cos(player.yaw); // avant du joueur
    const rr =  wdx*Math.cos(player.yaw) - wdy*Math.sin(player.yaw); // a droite
    return {px:cx0+rr*cell, py:cy0-rf*cell};
  }
  const sampleR=Math.ceil(radius*1.45);
  for(let dy=-sampleR;dy<sampleR;dy++) for(let dx=-sampleR;dx<sampleR;dx++){
    const gx=Math.floor(player.x+dx), gy=Math.floor(player.y+dy);
    let c='B'; if(gx>=0&&gy>=0&&gx<MAP&&gy<MAP) c=grid[gy][gx];
    const p=toMap(dx,dy);
    ctx.fillStyle = c==='.' ? '#c9cdd2' : c==='P' ? '#bfe3b6' : '#efefec';
    ctx.fillRect(p.px-cell/2, p.py-cell/2, cell+0.5, cell+0.5);
  }
  if(currentRoute && currentRoute.length>1){
    ctx.strokeStyle='rgba(230,57,70,0.85)'; ctx.setLineDash([5*iconScale,4*iconScale]); ctx.lineWidth=2*iconScale;
    ctx.beginPath(); let first=true;
    for(const p2 of currentRoute){ const m=toMap(p2.x-player.x,p2.y-player.y); if(first){ctx.moveTo(m.px,m.py);first=false;}else ctx.lineTo(m.px,m.py); }
    ctx.stroke(); ctx.setLineDash([]);
  }
  for(const e of entities){
    if(e.type==='ped'||e.type==='crosser') continue;
    const wdx=e.x-player.x, wdy=e.y-player.y;
    if(Math.abs(wdx)>sampleR||Math.abs(wdy)>sampleR) continue;
    const p=toMap(wdx,wdy);
    const paintMat=e.mesh.userData.matRefs && e.mesh.userData.matRefs.peinture;
    ctx.fillStyle = paintMat ? '#'+paintMat.color.getHexString() : '#ffffff';
    ctx.beginPath(); ctx.arc(p.px,p.py,1.7*iconScale,0,Math.PI*2); ctx.fill();
  }
  for(const s of shops){
    const wdx=(s.x+0.5)-player.x, wdy=(s.y+0.5)-player.y;
    if(Math.abs(wdx)>sampleR||Math.abs(wdy)>sampleR) continue;
    const p=toMap(wdx,wdy);
    ctx.fillStyle=colorToCss(s.color);
    ctx.beginPath(); ctx.arc(p.px,p.py,5*iconScale,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=1; ctx.stroke();
    drawPixelIconCtx(ctx,s.cat.icon,p.px,p.py,7*iconScale,'#111');
  }
  const wp=toMap(waypoint.x-player.x,waypoint.y-player.y);
  ctx.fillStyle='#e63946'; ctx.beginPath(); ctx.arc(wp.px,wp.py,3.5*iconScale,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111'; ctx.beginPath();
  ctx.moveTo(cx0,cy0-6*iconScale); ctx.lineTo(cx0-4*iconScale,cy0+4*iconScale); ctx.lineTo(cx0+4*iconScale,cy0+4*iconScale); ctx.closePath(); ctx.fill();
}

  el.textContent=text; el.classList.add('show');
  clearTimeout(itemToastTimer);
  itemToastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}
let doorFadeTimer=null;
function doorFadeFlash(){
  const el=document.getElementById('doorFade');
  el.classList.add('show');
  clearTimeout(doorFadeTimer);
  doorFadeTimer=setTimeout(()=>el.classList.remove('show'),380);
}

// =====================================================================================
//  BOUCLE PRINCIPALE
// =====================================================================================
startMission();
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05, clock.getDelta());
  frameTime+=dt;
  update(dt);
  updateEntities(dt,frameTime);
  updateTrafficLights(frameTime);
  waypointRing.material.opacity=1;
  waypointGroup.rotation.y+=dt*0.6;
  waypointGroup.visible=!insideShop;

  // ciel/pluie : suivent toujours le joueur pour ne jamais "sortir" de la zone visible
  skyDome.position.copy(camera.position);
  gameState.rainAnchor=camera.position;
  updateRain(dt);
  for(const cloud of clouds) cloud.lookAt(camera.position.x, cloud.position.y, camera.position.z);

  drawTopBar();
  drawStatusLine();
  drawMinimap();
  drawBigMap();
  renderer.render(scene,camera);
}
introEl.querySelector('.blink').innerHTML=L.pressStart;
loop();

}
</script>
