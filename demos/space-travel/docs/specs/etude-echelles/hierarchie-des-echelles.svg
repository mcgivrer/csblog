  <text x="24" y="153.0" fill="#e8edf5" font-size="12">Lune (rayon)</text>
  <line x1="456.0" y1="149.0" x2="539.0" y2="149.0" stroke="#8ea0c4" stroke-width="2" opacity="0.5"/>
