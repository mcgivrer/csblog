<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" width="980" height="590" font-family="monospace">
  <title>Plan à l'échelle du système Terra Dawn 350 : aujourd'hui et avec l'échelle allégée</title>
  <rect width="980" height="590" fill="#0b1220"/>
  <text x="24" y="28" fill="#e8edf5" font-size="16" font-weight="700">Un même système, vu de dessus et à l'échelle</text>
  <text x="24" y="48" fill="#8ea0c4" font-size="11">Terra Dawn 350 (K5 V) : trois planètes autour d'une étoile de type solaire. Chaque vue est cadrée sur son orbite la plus lointaine.</text>
  <rect x="20" y="70" width="460" height="460" fill="#0e1729" stroke="#25375c"/>
  <text x="32" y="90" fill="#8ea0c4" font-size="13" font-weight="700">aujourd'hui</text>
  <circle cx="250.0" cy="310.0" r="63.1" fill="none" stroke="#8ea0c4" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="250.0" cy="310.0" r="129.7" fill="none" stroke="#8ea0c4" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="250.0" cy="310.0" r="214.0" fill="none" stroke="#8ea0c4" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="250.0" cy="310.0" r="1.00" fill="#ffd9a0"/>
  <circle cx="250.0" cy="310.0" r="4.00" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.6"/>
  <circle cx="289.2" cy="359.4" r="16.86" fill="#c9a86a"/>
  <text x="312.1" y="362.4" fill="#e8edf5" font-size="10">géante, R = 310 u</text>
  <circle cx="121.6" cy="328.3" r="5.63" fill="#6a9a4a"/>
  <text x="133.2" y="331.3" fill="#e8edf5" font-size="10">continentale, R = 104 u</text>
  <circle cx="330.9" cy="111.9" r="7.44" fill="#5eb8e0"/>
  <text x="344.3" y="114.9" fill="#e8edf5" font-size="10">océanique, R = 137 u</text>
  <line x1="34" y1="508" x2="88.4" y2="508" stroke="#e8edf5" stroke-width="2"/>
  <text x="34" y="522" fill="#e8edf5" font-size="10">1 000 u</text>
  <text x="468" y="522" fill="#ffd9a0" font-size="10" text-anchor="end">étoile : R = 1,4 u</text>
  <rect x="500" y="70" width="460" height="460" fill="#0e1729" stroke="#25375c"/>
  <text x="512" y="90" fill="#5eead4" font-size="13" font-weight="700">échelle allégée</text>
  <circle cx="730.0" cy="310.0" r="63.1" fill="none" stroke="#8ea0c4" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="730.0" cy="310.0" r="129.7" fill="none" stroke="#8ea0c4" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="730.0" cy="310.0" r="214.0" fill="none" stroke="#8ea0c4" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="730.0" cy="310.0" r="6.60" fill="#ffd9a0"/>
  <circle cx="730.0" cy="310.0" r="9.60" fill="none" stroke="#ffb454" stroke-width="1" opacity="0.6"/>
  <circle cx="769.2" cy="359.4" r="6.74" fill="#c9a86a"/>
  <text x="781.9" y="362.4" fill="#e8edf5" font-size="10">géante, R = 930 u</text>
  <circle cx="601.6" cy="328.3" r="2.25" fill="#6a9a4a"/>
  <text x="609.9" y="331.3" fill="#e8edf5" font-size="10">continentale, R = 311 u</text>
  <circle cx="810.9" cy="111.9" r="2.98" fill="#5eb8e0"/>
  <text x="819.9" y="114.9" fill="#e8edf5" font-size="10">océanique, R = 410 u</text>
  <line x1="514" y1="508" x2="586.5" y2="508" stroke="#e8edf5" stroke-width="2"/>
  <text x="514" y="522" fill="#e8edf5" font-size="10">10 000 u</text>
  <text x="948" y="522" fill="#ffd9a0" font-size="10" text-anchor="end">étoile : R = 910 u</text>
  <text x="24" y="556" fill="#8ea0c4" font-size="11">À gauche, l'étoile mesure 0,1 % de la première orbite et se réduit à un point : les planètes, de 100 à 320 u de rayon, dominent le système.</text>
  <text x="24" y="574" fill="#8ea0c4" font-size="11">À droite, l'étoile est le plus gros astre, les planètes deviennent de petits disques sur de grandes orbites (orbites x7,5 ; planètes x3).</text>
</svg>
