  <circle cx="676" cy="26" r="6" fill="#5eead4"/>
  <text x="688" y="30" fill="#e8edf5" font-size="12">échelle allégée</text>
  <circle cx="836" cy="26" r="6" fill="#ffb454"/>
  <text x="848" y="30" fill="#e8edf5" font-size="12">échelle cible</text>
  <line x1="290.0" y1="84" x2="290.0" y2="434" stroke="#25375c" stroke-width="1"/>
