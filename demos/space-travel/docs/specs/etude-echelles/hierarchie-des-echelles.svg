  <text x="24" y="343.0" fill="#e8edf5" font-size="12">Orbite la plus lointaine</text>
  <line x1="654.0" y1="339.0" x2="806.8" y2="339.0" stroke="#8ea0c4" stroke-width="2" opacity="0.5"/>
