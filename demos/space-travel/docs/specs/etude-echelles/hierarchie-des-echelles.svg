<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="monospace">
  <title>Hiérarchie des tailles et des distances : aujourd'hui, échelle allégée, échelle cible (axe logarithmique)</title>
  <rect width="980" height="520" fill="#0b1220"/>
  <text x="24" y="30" fill="#e8edf5" font-size="16" font-weight="700">Hiérarchie des tailles et des distances</text>
